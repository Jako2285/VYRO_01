
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080808">
<title>VYRO_01</title>
<style>
:root{--bg:#080808;--panel:#151515;--line:#303030;--muted:#999;--red:#e63232;--green:#6cdb9b}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,Helvetica,sans-serif}
button,input,textarea,select{font:inherit}
button{cursor:pointer;transition:transform .18s ease,background .2s ease,border-color .2s ease,opacity .2s ease}
button:active{transform:scale(.97)}
button:disabled{opacity:.5;cursor:not-allowed}
.hidden{display:none!important}
header{height:68px;padding:0 5%;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(8,8,8,.92);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);z-index:10}
.logo{font-weight:950;font-size:22px;letter-spacing:2px}
.logo span{color:var(--red)}
.actions{display:flex;gap:8px}
.btn{border:1px solid white;background:white;color:#080808;padding:12px 17px;font-weight:800;border-radius:15px;box-shadow:0 2px 8px #0002}
.btn:hover{opacity:.87}
.outline{background:#ffffff08;color:white;border-color:#444}
.red{background:var(--red);border-color:var(--red);color:white}
.small{padding:9px 12px;font-size:12px;border-radius:12px}
.hero{min-height:calc(100vh - 68px);min-height:calc(100svh - 68px);display:flex;align-items:center;justify-content:center;text-align:center;padding:40px 20px;background:radial-gradient(ellipse at 50% 28%,#352020,#171313 42%,#080808 78%);position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;width:310px;height:310px;border:1px solid #e632321c;border-radius:50%;top:12%;left:50%;transform:translateX(-50%);box-shadow:0 0 90px #e6323210,inset 0 0 70px #e6323208;pointer-events:none}
.hero-content{max-width:760px;position:relative;z-index:1;animation:rise .8s ease both}
.eyebrow{color:#aaa;letter-spacing:4px;font-size:10px;font-weight:700}
.hero h1{font-size:clamp(55px,12vw,110px);letter-spacing:-4px;margin:24px 0 12px;font-weight:950}
.hero h1:after{content:".";color:var(--red)}
.hero p{color:#aaa;line-height:1.8}
.hero-buttons{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:30px}
.section{max-width:1400px;margin:auto;padding:40px 5% 65px;min-height:70vh}
.heading{display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap;margin-bottom:25px}
.heading h2{margin:8px 0 0;font-size:28px;letter-spacing:-.7px}
.muted{color:var(--muted)}
.products{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:19px}
.product{background:linear-gradient(145deg,#171717,#101010);border:1px solid #292929;min-width:0;border-radius:20px;overflow:hidden;transition:transform .25s ease,border-color .25s ease,box-shadow .25s ease;animation:rise .45s ease both}
.product:hover{transform:translateY(-4px);border-color:#5a3434;box-shadow:0 12px 35px #0005}
.product-image{aspect-ratio:4/4.7;background:radial-gradient(ellipse at center,#292929,#141414);position:relative;overflow:hidden;cursor:pointer}
.product-image img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s ease}
.product:hover .product-image img{transform:scale(1.035)}
.image-hint{position:absolute;right:10px;bottom:10px;width:35px;height:35px;border-radius:50%;display:grid;place-items:center;background:#080808b8;border:1px solid #ffffff35;backdrop-filter:blur(10px);font-size:16px}
.product-info{padding:15px}
.product-info h3{margin:0 0 8px;font-size:16px;letter-spacing:-.2px}
.description{font-size:12px;line-height:1.6;color:#aaa;white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.price{font-weight:900;font-size:17px;margin:13px 0}
.product-info button{width:100%}
.stock{font-size:11px;color:var(--green);margin-bottom:13px;display:flex;align-items:center;gap:6px}
.stock:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;display:inline-block}
.stock.low{color:#ffbd65}
.stock.sold{color:#ff6c6c}
.product .btn{border-radius:13px}
.empty{border:1px dashed #383838;border-radius:18px;padding:35px;text-align:center;color:#888;grid-column:1/-1}
footer{padding:25px;text-align:center;color:#777;border-top:1px solid var(--line);font-size:12px}
.overlay{position:fixed;inset:0;background:#000b;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);z-index:20;display:flex;align-items:center;justify-content:center;padding:18px;animation:fade .2s ease}
.modal{width:min(440px,100%);max-height:90vh;max-height:90svh;overflow:auto;background:linear-gradient(150deg,#191919,#101010);border:1px solid #383838;border-radius:25px;padding:24px;box-shadow:0 25px 100px #0009;animation:rise .25s ease}
.modal h2{margin-top:0;letter-spacing:-.5px}
.modal.product-modal{width:min(760px,100%);padding:0;overflow:auto}
.detail-layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.detail-image{min-height:360px;background:#191919;position:relative}
.detail-image img{width:100%;height:100%;min-height:360px;object-fit:cover;display:block}
.detail-content{padding:25px}
.detail-content h2{font-size:27px;margin:12px 0}
.detail-description{white-space:pre-wrap;line-height:1.8;color:#bbb;font-size:14px;margin:18px 0}
.detail-price{font-size:25px;font-weight:900;margin:18px 0}
.close-detail{position:absolute;z-index:2;top:12px;right:12px;width:38px;height:38px;border-radius:50%;border:1px solid #ffffff40;background:#080808b8;color:white;font-size:21px;display:grid;place-items:center}
.field{display:flex;flex-direction:column;gap:7px;margin:14px 0}
.field label{font-size:12px;color:#bbb}
.field input,.field textarea,.field select{width:100%;padding:13px;background:#080808;color:white;border:1px solid #383838;border-radius:13px;outline:none;transition:border-color .2s}
.field input:focus,.field textarea:focus,.field select:focus{border-color:#e63232}
.field textarea{min-height:85px;resize:vertical}
.field input[type=file]{padding:9px}
.row{display:flex;gap:9px}
.row>*{flex:1;min-width:0}
.admin-layout{display:grid;grid-template-columns:185px minmax(0,1fr);gap:25px}
.admin-nav{display:flex;flex-direction:column;gap:8px}
.admin-nav button{text-align:left;border-radius:13px}
.admin-nav button.active{border-color:var(--red);color:var(--red);background:#e6323210}
.admin-content{min-width:0}
.notice{padding:14px;background:#191919;border:1px solid #333;border-radius:15px;color:#bbb;font-size:12px;line-height:1.7;margin-bottom:20px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:20px 0}
.stat{background:linear-gradient(145deg,#191919,#111);border:1px solid #303030;border-radius:17px;padding:16px}
.stat span{display:block;color:#999;font-size:11px;margin-bottom:8px}
.stat strong{font-size:25px;overflow-wrap:anywhere}
.admin-product,.order-card{background:#121212;border:1px solid #303030;border-radius:16px;padding:13px;margin-bottom:10px}
.admin-product{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.admin-product img{width:65px;height:78px;object-fit:cover;background:#222;border-radius:10px}
.admin-product-info{flex:1;min-width:100px}
.admin-product-info strong{display:block;margin-bottom:6px}
.admin-product-actions{display:flex;gap:6px;flex-wrap:wrap}
.order-top{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.order-details{white-space:pre-wrap;color:#bbb;font-size:13px;line-height:1.8;margin:12px 0}
.badge{font-size:11px;padding:6px 9px;background:#292929;border-radius:8px}
.order-items{border-top:1px solid #333;padding-top:10px;font-size:13px;line-height:1.8}
.check{display:flex;align-items:center;gap:9px;font-size:13px}
.check input{width:auto}
#toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#f6f6f6;color:#111;padding:13px 18px;z-index:40;max-width:90%;font-size:13px;border-radius:15px;box-shadow:0 8px 35px #0008;text-align:center}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media(max-width:900px){.products{grid-template-columns:repeat(3,minmax(0,1fr))}.admin-layout{grid-template-columns:1fr}.admin-nav{display:grid;grid-template-columns:repeat(3,1fr)}.admin-nav button{text-align:center;font-size:12px;padding:10px 4px}}
@media(max-width:600px){
header{height:60px;padding:0 4%}.logo{font-size:18px}.actions{gap:5px}.actions .btn{padding:9px 9px;font-size:10px}
.hero{min-height:85vh;min-height:85svh}.hero h1{letter-spacing:-2px}.section{padding:30px 4% 50px}
.products{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.product{border-radius:16px}.product-info{padding:10px}.product-info h3{font-size:14px}.product-info button{font-size:11px;padding:11px 4px}.price{font-size:15px}.stock{font-size:10px}
.stats{grid-template-columns:1fr 1fr}.stat:last-child{grid-column:1/-1}.admin-product-actions{width:100%}
.detail-layout{grid-template-columns:1fr}.detail-image,.detail-image img{min-height:0;height:auto;max-height:44vh;aspect-ratio:4/3}.detail-content{padding:19px}.detail-content h2{font-size:23px}.modal.product-modal{max-height:92vh;max-height:92svh}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header>
  <div class="logo">VYRO<span>_01</span></div>
  <div class="actions">
    <button class="btn outline small" onclick="showPage('home')">HOME</button>
    <button class="btn small" onclick="openParameters()">PARAMETERS</button>
  </div>
</header>

<main>
<section id="homePage" class="hero">
  <div class="hero-content">
    <div class="eyebrow" id="heroTag">THE OFFICIAL COLLECTION</div>
    <h1 id="heroTitle">VYRO_01</h1>
    <p id="heroDescription">Discover the collection. Define your style.</p>
    <div class="hero-buttons">
      <button class="btn" onclick="showPage('shop')">START SHOPPING</button>
      <button class="btn outline" onclick="openParameters()">PARAMETERS</button>
    </div>
  </div>
</section>

<section id="shopPage" class="section hidden">
  <div class="heading">
    <div><div class="eyebrow">VYRO_01 COLLECTION</div><h2 id="shopTitle">OUR PRODUCTS</h2></div>
    <button class="btn outline small" onclick="showPage('home')">BACK HOME</button>
  </div>
  <p id="shopDescription" class="muted"></p>
  <div id="productsGrid" class="products"></div>
</section>

<section id="adminPage" class="section hidden">
  <div class="heading">
    <div><div class="eyebrow">PRIVATE AREA</div><h2>CONTROL PANEL</h2></div>
    <button class="btn outline small" onclick="logout()">LOG OUT</button>
  </div>
  <div id="connectionNotice" class="notice"></div>
  <div class="admin-layout">
    <nav class="admin-nav">
      <button class="btn outline active" data-tab="dashboard" onclick="openTab('dashboard')">Dashboard</button>
      <button class="btn outline" data-tab="products" onclick="openTab('products')">Products</button>
      <button class="btn outline" data-tab="orders" onclick="openTab('orders')">Orders</button>
      <button class="btn outline" data-tab="customize" onclick="openTab('customize')">Customize</button>
      <button class="btn outline" data-tab="settings" onclick="openTab('settings')">Settings</button>
    </nav>
    <div id="adminContent" class="admin-content"></div>
  </div>
</section>
</main>
<footer id="footerText">VYRO_01 · OFFICIAL STORE</footer>

<div id="passwordOverlay" class="overlay hidden">
  <form class="modal" onsubmit="login(event)">
    <h2>STAFF ACCESS</h2>
    <p class="muted">Enter your staff password.</p>
    <div class="field"><label>PASSWORD</label><input id="passwordInput" type="password" required autocomplete="current-password"></div>
    <div class="row"><button class="btn outline" type="button" onclick="closePassword()">CANCEL</button><button class="btn" type="submit">ENTER</button></div>
  </form>
</div>

<div id="orderOverlay" class="overlay hidden">
  <form class="modal" onsubmit="submitOrder(event)">
    <h2>PLACE YOUR ORDER</h2>
    <p id="orderSummary" class="muted"></p>
    <div class="field"><label>FULL NAME *</label><input id="customerName" maxlength="100" required autocomplete="name"></div>
    <div class="field"><label>PHONE NUMBER *</label><input id="customerPhone" type="tel" maxlength="30" required autocomplete="tel"></div>
    <div class="field"><label>DELIVERY ADDRESS *</label><textarea id="customerAddress" maxlength="500" required autocomplete="street-address"></textarea></div>
    <div class="field"><label>QUANTITY *</label><input id="customerQuantity" type="number" min="1" step="1" value="1" required></div>
    <div id="orderStockInfo" class="stock"></div>
    <div class="field"><label>NOTES (OPTIONAL)</label><textarea id="customerNotes" maxlength="500"></textarea></div>
    <div class="row"><button class="btn outline" type="button" onclick="closeOrder()">CANCEL</button><button class="btn" type="submit">CONFIRM ORDER</button></div>
  </form>
</div>

<div id="productDetailOverlay" class="overlay hidden" onclick="if(event.target===this)closeProductDetails()">
  <div class="modal product-modal">
    <div id="productDetailContent"></div>
  </div>
</div>
<div id="toast" class="hidden" role="status" aria-live="polite"></div>

<script>
/*
For shared data and photos across multiple phones:
Configure Firebase below, enable Realtime Database and Storage,
and configure their security rules. Without Firebase, data is stored
only in this browser and cannot automatically sync across devices.

This starter's password check is client-side and is not secure against
someone inspecting the source code. A production store needs server-side
authentication and authorization.
*/
const STAFF_PASSWORD="JIJI";

const firebaseConfig={
  apiKey:"PASTE_YOUR_FIREBASE_API_KEY",
  authDomain:"PASTE_YOUR_PROJECT.firebaseapp.com",
  databaseURL:"PASTE_YOUR_REAL_DATABASE_URL",
  projectId:"PASTE_YOUR_PROJECT_ID",
  storageBucket:"PASTE_YOUR_REAL_STORAGE_BUCKET",
  messagingSenderId:"PASTE_YOUR_MESSAGING_SENDER_ID",
  appId:"PASTE_YOUR_APP_ID"
};
const SDK="https://www.gstatic.com/firebasejs/10.14.1/";
const configured=firebaseConfig.apiKey.startsWith("AIza")&&
  !firebaseConfig.projectId.startsWith("PASTE_")&&
  !firebaseConfig.databaseURL.startsWith("PASTE_")&&
  !firebaseConfig.storageBucket.startsWith("PASTE_");

const defaults={
  settings:{
    heroTag:"THE OFFICIAL COLLECTION",
    heroTitle:"VYRO_01",
    heroDescription:"Discover the collection. Define your style.",
    shopTitle:"OUR PRODUCTS",
    shopDescription:"Find your next favourite piece.",
    footerText:"VYRO_01 · OFFICIAL STORE",
    currency:"TND"
  },
  products:[],
  orders:[]
};

let state=JSON.parse(JSON.stringify(defaults));
let db=null,storage=null,cloudReady=false,loggedIn=false;
let activeTab="dashboard",selectedProduct=null,editingProduct=null,toastTimer;
let audioContext=null,lastCloudUpdate=0;

const $=id=>document.getElementById(id);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,10);

function esc(v){
  return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function imageURL(v){
  if(!v)return "";
  if(String(v).startsWith("data:image/"))return String(v);
  try{const u=new URL(v,location.href);if(["https:","http:"].includes(u.protocol))return u.href;}catch(e){}
  return "";
}
function money(v){
  return (Number(v)||0).toLocaleString(undefined,{maximumFractionDigits:3})+" "+(state.settings.currency||"TND");
}
function stockOf(p){return Math.max(0,Math.floor(Number(p?.stock)||0));}
function playClick(){
  try{
    const AudioCtx=window.AudioContext||window.webkitAudioContext;
    if(!AudioCtx)return;
    if(!audioContext)audioContext=new AudioCtx();
    if(audioContext.state==="suspended")audioContext.resume();
    const oscillator=audioContext.createOscillator();
    const gain=audioContext.createGain();
    oscillator.type="sine";
    oscillator.frequency.setValueAtTime(520,audioContext.currentTime);
    oscillator.frequency.exponentialRampToValueAtTime(390,audioContext.currentTime+.045);
    gain.gain.setValueAtTime(.0001,audioContext.currentTime);
    gain.gain.exponentialRampToValueAtTime(.025,audioContext.currentTime+.006);
    gain.gain.exponentialRampToValueAtTime(.0001,audioContext.currentTime+.055);
    oscillator.connect(gain);gain.connect(audioContext.destination);
    oscillator.start();oscillator.stop(audioContext.currentTime+.06);
  }catch(e){}
}
document.addEventListener("click",e=>{
  if(e.target.closest("button"))playClick();
});

function notify(message){
  $("toast").textContent=message;
  $("toast").classList.remove("hidden");
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>$("toast").classList.add("hidden"),3000);
}
function saveLocal(){
  try{localStorage.setItem("vyro01_store",JSON.stringify(state));}catch(e){notify("Storage is full. Try using smaller product images.");}
}
function loadLocal(){
  try{
    const d=JSON.parse(localStorage.getItem("vyro01_store")||"null");
    if(d)state={settings:{...defaults.settings,...(d.settings||{})},products:Array.isArray(d.products)?d.products:[],orders:Array.isArray(d.orders)?d.orders:[]};
  }catch(e){}
}
async function saveState(){
  saveLocal();
  renderStore();
  if(cloudReady){
    try{await db.ref("vyro01").set(state);}
    catch(e){console.error(e);notify("Cloud save failed. Check Firebase configuration and permissions.");}
  }
  updateNotice();
}
function renderSettings(){
  const s=state.settings;
  $("heroTag").textContent=s.heroTag;
  $("heroTitle").textContent=s.heroTitle;
  $("heroDescription").textContent=s.heroDescription;
  $("shopTitle").textContent=s.shopTitle;
  $("shopDescription").textContent=s.shopDescription;
  $("footerText").textContent=s.footerText;
  document.title=(s.heroTitle||"VYRO_01")+" | Official Store";
}
function showPage(page){
  $("homePage").classList.toggle("hidden",page!=="home");
  $("shopPage").classList.toggle("hidden",page!=="shop");
  $("adminPage").classList.toggle("hidden",page!=="admin");
  if(page==="shop")renderStore();
  if(page==="admin"&&loggedIn)renderAdmin();
  window.scrollTo({top:0,behavior:"smooth"});
}
function openParameters(){
  if(loggedIn){showPage("admin");return;}
  $("passwordInput").value="";
  $("passwordOverlay").classList.remove("hidden");
}
function closePassword(){$("passwordOverlay").classList.add("hidden");}
function login(e){
  e.preventDefault();
  if($("passwordInput").value!==STAFF_PASSWORD){notify("Incorrect password.");return;}
  loggedIn=true;closePassword();showPage("admin");notify("Welcome to the control panel.");
}
function logout(){loggedIn=false;editingProduct=null;showPage("home");}

function renderStore(){
  renderSettings();
  const list=state.products.filter(p=>p&&p.active!==false);
  $("productsGrid").innerHTML=list.length?list.map((p,index)=>{
    const stock=stockOf(p),sold=stock<=0,img=imageURL(p.image);
    const stockClass=sold?"sold":stock<=3?"low":"";
    const stockText=sold?"OUT OF STOCK":stock<=3?`ONLY ${stock} LEFT`:`${stock} AVAILABLE`;
    return `<article class="product" style="animation-delay:${Math.min(index,8)*.045}s">
      <div class="product-image" role="button" tabindex="0" aria-label="View ${esc(p.name)} details" onclick="openProductDetails('${esc(p.id)}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openProductDetails('${esc(p.id)}')}">
        ${img?`<img src="${esc(img)}" alt="${esc(p.name)}" loading="lazy">`:'<div style="height:100%;display:grid;place-items:center;color:#666;font-size:12px">NO IMAGE</div>'}
        <span class="image-hint" aria-hidden="true">⌕</span>
      </div>
      <div class="product-info">
        <h3>${esc(p.name)}</h3>
        <div class="description">${esc(p.description||"")}</div>
        <div class="price">${money(p.price)}</div>
        <div class="stock ${stockClass}">${stockText}</div>
        <button class="btn ${sold?"outline":""}" ${sold?"disabled":""} onclick="openOrder('${esc(p.id)}')">${sold?"SOLD OUT":"ORDER NOW"}</button>
      </div></article>`;
  }).join(""):'<div class="empty">No products available yet.</div>';
}
function openProductDetails(id){
  const p=state.products.find(x=>x.id===id&&x.active!==false);
  if(!p){notify("Product unavailable.");return;}
  const stock=stockOf(p),img=imageURL(p.image),sold=stock<=0;
  $("productDetailContent").innerHTML=`
    <div class="detail-image">
      <button class="close-detail" type="button" aria-label="Close details" onclick="closeProductDetails()">×</button>
      ${img?`<img src="${esc(img)}" alt="${esc(p.name)}">`:'<div style="height:100%;min-height:220px;display:grid;place-items:center;color:#777">NO IMAGE</div>'}
    </div>
    <div class="detail-content">
      <div class="eyebrow">VYRO_01 · PRODUCT DETAILS</div>
      <h2>${esc(p.name)}</h2>
      <div class="detail-price">${money(p.price)}</div>
      <div class="stock ${sold?"sold":stock<=3?"low":""}">${sold?"OUT OF STOCK":`${stock} PIECE${stock===1?"":"S"} LEFT`}</div>
      <div class="detail-description">${esc(p.description||"No additional description available.")}</div>
      <button class="btn ${sold?"outline":""}" style="width:100%" ${sold?"disabled":""} onclick="closeProductDetails();openOrder('${esc(p.id)}')">${sold?"SOLD OUT":"ORDER THIS PRODUCT"}</button>
      <p class="muted" style="font-size:11px;margin-top:15px">Limited pieces. Availability may change.</p>
    </div>`;
  $("productDetailOverlay").classList.remove("hidden");
}
function closeProductDetails(){$("productDetailOverlay").classList.add("hidden");}
function openOrder(id){
  const p=state.products.find(x=>x.id===id);
  if(!p||p.active===false||stockOf(p)<=0){notify("Product unavailable.");return;}
  selectedProduct=id;
  $("orderSummary").textContent=p.name+" — "+money(p.price);
  $("customerQuantity").max=String(stockOf(p));
  $("customerQuantity").value="1";
  $("orderStockInfo").textContent=`${stockOf(p)} piece${stockOf(p)===1?"":"s"} currently available`;
  ["customerName","customerPhone","customerAddress","customerNotes"].forEach(id=>$(id).value="");
  $("orderOverlay").classList.remove("hidden");
}
function closeOrder(){$("orderOverlay").classList.add("hidden");selectedProduct=null;}

async function submitOrder(e){
  e.preventDefault();
  const p=state.products.find(x=>x.id===selectedProduct);
  if(!p||p.active===false){notify("Product not found or unavailable.");return;}
  const qty=Number($("customerQuantity").value),available=stockOf(p);
  if(!Number.isInteger(qty)||qty<1||qty>available){
    notify(`Only ${available} piece${available===1?"":"s"} available.`);
    $("customerQuantity").max=String(available);
    $("orderStockInfo").textContent=`Only ${available} piece${available===1?"":"s"} available now`;
    return;
  }
  const customer={
    name:$("customerName").value.trim(),
    phone:$("customerPhone").value.trim(),
    address:$("customerAddress").value.trim(),
    notes:$("customerNotes").value.trim()
  };
  if(!customer.name||!customer.phone||!customer.address){notify("Complete all required fields.");return;}

  const order={
    id:uid(),createdAt:new Date().toISOString(),status:"New",customer,
    items:[{productId:p.id,name:p.name,price:Number(p.price)||0,quantity:qty}],
    total:(Number(p.price)||0)*qty,
    stockDeducted:true
  };
  p.stock=available-qty;
  state.orders.unshift(order);
  closeOrder();
  await saveState();
  notify(cloudReady?"Order submitted.":"Order saved on this device only.");
  showPage("shop");
}

function updateNotice(){
  const n=$("connectionNotice");if(!n)return;
  n.textContent=cloudReady
    ?"CLOUD CONNECTED — products and orders synchronize through Firebase."
    :"LOCAL MODE — configure Firebase to share changes and orders across phones.";
}
function openTab(tab){
  activeTab=tab;
  document.querySelectorAll("[data-tab]").forEach(b=>b.classList.toggle("active",b.dataset.tab===tab));
  renderAdmin();
}
function renderAdmin(){
  if(!loggedIn)return;
  updateNotice();
  const c=$("adminContent");
  if(activeTab==="dashboard")c.innerHTML=dashboardHTML();
  if(activeTab==="products")c.innerHTML=productsHTML();
  if(activeTab==="orders")c.innerHTML=ordersHTML();
  if(activeTab==="customize")c.innerHTML=customizeHTML();
  if(activeTab==="settings")c.innerHTML=settingsHTML();
}
function dashboardHTML(){
  const total=state.orders.reduce((s,o)=>s+(Number(o.total)||0),0);
  return `<h2>Dashboard</h2><div class="stats">
  <div class="stat"><span>PRODUCTS</span><strong>${state.products.length}</strong></div>
  <div class="stat"><span>ORDERS</span><strong>${state.orders.length}</strong></div>
  <div class="stat"><span>ORDER TOTALS</span><strong style="font-size:19px">${money(total)}</strong></div>
  </div><div class="heading"><h3>Recent orders</h3><button class="btn outline small" onclick="openTab('orders')">VIEW ALL</button></div>
  ${state.orders.length?state.orders.slice(0,5).map(orderHTML).join(""):'<div class="empty">No orders yet.</div>'}
  <p><button class="btn" onclick="newProduct()">+ ADD PRODUCT</button></p>`;
}
function productsHTML(){
  return `<div class="heading"><h2>Products</h2><button class="btn" onclick="newProduct()">+ ADD PRODUCT</button></div>
  <div id="productEditor"></div>
  ${state.products.length?state.products.map(p=>`<div class="admin-product">
  ${imageURL(p.image)?`<img src="${esc(imageURL(p.image))}" alt="">`:'<div style="width:65px;height:78px;background:#222;border-radius:10px"></div>'}
  <div class="admin-product-info"><strong>${esc(p.name)}</strong><div class="muted">${money(p.price)} · Stock: ${stockOf(p)}</div><div class="muted">${p.active===false?"Hidden":"Visible"}</div></div>
  <div class="admin-product-actions">
  <button class="btn outline small" onclick="editProduct('${esc(p.id)}')">EDIT</button>
  <button class="btn outline small" onclick="toggleProduct('${esc(p.id)}')">${p.active===false?"SHOW":"HIDE"}</button>
  <button class="btn red small" onclick="deleteProduct('${esc(p.id)}')">DELETE</button>
  </div></div>`).join(""):'<div class="empty">No products yet. Add your first product.</div>'}`;
}
function newProduct(){editingProduct=null;openTab("products");setTimeout(()=>productEditor(null),0);}
function editProduct(id){editingProduct=id;openTab("products");setTimeout(()=>{const p=state.products.find(x=>x.id===id);if(p)productEditor(p);},0);}
function productEditor(p){
  const root=$("productEditor");if(!root)return;
  root.innerHTML=`<div class="modal" style="width:100%;max-height:none;margin-bottom:22px">
  <h3>${p?"Edit product":"Add product"}</h3>
  <form id="productForm" onsubmit="saveProduct(event)">
  <div class="field"><label>PRODUCT NAME *</label><input name="name" required maxlength="120" value="${esc(p?.name||"")}"></div>
  <div class="field"><label>DESCRIPTION</label><textarea name="description" maxlength="2000">${esc(p?.description||"")}</textarea></div>
  <div class="row">
  <div class="field"><label>PRICE *</label><input name="price" type="number" min="0" step="0.001" required value="${Number(p?.price||0)}"></div>
  <div class="field"><label>STOCK *</label><input name="stock" type="number" min="0" step="1" required value="${Number(p?.stock??1)}"></div>
  </div>
  <div class="field"><label>UPLOAD IMAGE FROM PHONE</label><input id="imageFile" type="file" accept="image/*"></div>
  <div class="field"><label>OR IMAGE URL</label><input name="imageUrl" type="url" value="${esc(p?.image||"")}" placeholder="https://..."></div>
  <label class="check"><input id="productActive" type="checkbox" ${p?.active===false?"":"checked"}> Show product in store</label>
  <div class="row" style="margin-top:18px"><button type="button" class="btn outline" onclick="renderAdmin()">CANCEL</button><button type="submit" class="btn">SAVE PRODUCT</button></div>
  </form></div>`;
  root.scrollIntoView({behavior:"smooth",block:"start"});
}
async function uploadImage(file){
  if(!file)return null;
  if(!file.type.startsWith("image/"))throw Error("Choose an image file.");
  if(file.size>8*1024*1024)throw Error("Image must be smaller than 8 MB.");
  if(cloudReady&&storage){
    const path="products/"+uid()+"_"+file.name.replace(/[^a-zA-Z0-9._-]/g,"_");
    const ref=storage.ref(path);await ref.put(file);return await ref.getDownloadURL();
  }
  return await new Promise((resolve,reject)=>{
    const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(Error("Could not read image."));r.readAsDataURL(file);
  });
}
async function saveProduct(e){
  e.preventDefault();
  const form=e.target,data=new FormData(form),submit=form.querySelector('[type=submit]');
  submit.disabled=true;submit.textContent="SAVING...";
  try{
    const old=state.products.find(p=>p.id===editingProduct);
    let image=String(data.get("imageUrl")||"").trim();
    const file=$("imageFile").files[0];
    if(file)image=await uploadImage(file);
    else if(old&&!image)image=old.image||"";
    const enteredStock=Number(data.get("stock"));
    const p={
      id:editingProduct||uid(),name:String(data.get("name")||"").trim(),
      description:String(data.get("description")||"").trim(),
      price:Number(data.get("price")),stock:enteredStock,image,
      active:$("productActive").checked,createdAt:old?.createdAt||new Date().toISOString(),
      updatedAt:new Date().toISOString()
    };
    if(!p.name||!Number.isFinite(p.price)||p.price<0||!Number.isInteger(p.stock)||p.stock<0)throw Error("Check product name, price and stock.");

    if(old){
      const alreadyReserved=state.orders.reduce((sum,o)=>{
        if(!o.stockDeducted||(o.status||"New")==="Cancelled")return sum;
        return sum+(o.items||[]).reduce((n,i)=>n+(i.productId===old.id?(Number(i.quantity)||0):0),0);
      },0);
      if(enteredStock<alreadyReserved)throw Error(`Stock cannot be lower than ${alreadyReserved} pieces reserved by active orders.`);
      state.products=state.products.map(x=>x.id===old.id?p:x);
    }else state.products.unshift(p);

    editingProduct=null;await saveState();renderAdmin();
    notify(cloudReady?"Product saved and synchronized.":"Product saved locally. Configure Firebase to share it.");
  }catch(err){notify(err.message||"Could not save product.");submit.disabled=false;submit.textContent="SAVE PRODUCT";}
}
async function toggleProduct(id){
  const p=state.products.find(x=>x.id===id);if(!p)return;
  p.active=p.active===false;await saveState();renderAdmin();
}
async function deleteProduct(id){
  const p=state.products.find(x=>x.id===id);
  if(!p||!confirm("Delete "+p.name+"?"))return;
  state.products=state.products.filter(x=>x.id!==id);await saveState();renderAdmin();notify("Product deleted.");
}
function ordersHTML(){
  return `<div class="heading"><div><h2>Orders</h2><p class="muted">${state.orders.length} orders</p></div><button class="btn outline small" onclick="exportOrders()">EXPORT CSV</button></div>
  <div class="field"><label>FILTER</label><select id="orderFilter" onchange="filterOrders()"><option value="all">All orders</option>${["New","Confirmed","Shipped","Completed","Cancelled"].map(s=>`<option>${s}</option>`).join("")}</select></div>
  <div id="ordersList">${state.orders.length?state.orders.map(orderHTML).join(""):'<div class="empty">No orders yet.</div>'}</div>`;
}
function orderHTML(o){
  const c=o.customer||{},items=Array.isArray(o.items)?o.items:[];
  return `<div class="order-card" data-status="${esc(o.status||"New")}">
  <div class="order-top"><strong>Order #${esc(o.id)}</strong><span class="badge">${esc(o.status||"New")}</span></div>
  <p class="muted" style="font-size:11px">${esc(o.createdAt?new Date(o.createdAt).toLocaleString():"")}</p>
  <div class="order-details">Name: ${esc(c.name)}
Phone: ${esc(c.phone)}
Address: ${esc(c.address)}
Notes: ${esc(c.notes||"—")}</div>
  <div class="order-items">${items.map(i=>`<div>${esc(i.name)} × ${Number(i.quantity)||1} — ${money((Number(i.price)||0)*(Number(i.quantity)||1))}</div>`).join("")}
  <strong>TOTAL: ${money(o.total)}</strong></div>
  <div class="row" style="margin-top:12px"><div class="field"><label>STATUS</label><select onchange="changeStatus('${esc(o.id)}',this.value)">${["New","Confirmed","Shipped","Completed","Cancelled"].map(s=>`<option ${((o.status||"New")===s)?"selected":""}>${s}</option>`).join("")}</select></div>
  <div style="display:flex;align-items:end;padding-bottom:14px"><button class="btn red small" onclick="deleteOrder('${esc(o.id)}')">DELETE</button></div></div>
  </div>`;
}
function filterOrders(){
  const f=$("orderFilter").value;
  document.querySelectorAll("#ordersList .order-card").forEach(card=>card.classList.toggle("hidden",f!=="all"&&card.dataset.status!==f));
}
async function changeStatus(id,status){
  const o=state.orders.find(x=>x.id===id);if(!o)return;
  const oldStatus=o.status||"New";
  if(status==="Cancelled"&&oldStatus!=="Cancelled"&&o.stockDeducted){
    for(const item of (o.items||[])){
      const p=state.products.find(x=>x.id===item.productId);
      if(p)p.stock=stockOf(p)+(Number(item.quantity)||0);
    }
    o.stockDeducted=false;
  }else if(oldStatus==="Cancelled"&&status!=="Cancelled"&&!o.stockDeducted){
    for(const item of (o.items||[])){
      const p=state.products.find(x=>x.id===item.productId);
      if(!p||stockOf(p)<(Number(item.quantity)||0)){
        notify(`Cannot reactivate order: insufficient stock for ${item.name}.`);
        renderAdmin();return;
      }
    }
    for(const item of (o.items||[])){
      const p=state.products.find(x=>x.id===item.productId);
      if(p)p.stock=stockOf(p)-(Number(item.quantity)||0);
    }
    o.stockDeducted=true;
  }
  o.status=status;await saveState();renderAdmin();notify("Order updated.");
}
async function deleteOrder(id){
  const o=state.orders.find(x=>x.id===id);
  if(!o||!confirm("Delete this order permanently?"))return;
  if(o.stockDeducted&&(o.status||"New")!=="Cancelled"){
    for(const item of (o.items||[])){
      const p=state.products.find(x=>x.id===item.productId);
      if(p)p.stock=stockOf(p)+(Number(item.quantity)||0);
    }
  }
  state.orders=state.orders.filter(x=>x.id!==id);await saveState();renderAdmin();notify("Order deleted.");
}
function exportOrders(){
  const rows=[["Order ID","Date","Status","Name","Phone","Address","Notes","Products","Total"]];
  state.orders.forEach(o=>{const c=o.customer||{};rows.push([o.id,o.createdAt,o.status,c.name,c.phone,c.address,c.notes,(o.items||[]).map(i=>i.name+" x"+i.quantity).join("; "),o.total]);});
  const csv=rows.map(r=>r.map(v=>'"'+String(v??"").replace(/"/g,'""')+'"').join(",")).join("\r\n");
  const url=URL.createObjectURL(new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8"}));
  const a=document.createElement("a");a.href=url;a.download="VYRO_01_orders.csv";a.click();URL.revokeObjectURL(url);
}
function customizeHTML(){
  const s=state.settings;
  return `<h2>Customize storefront</h2><form onsubmit="saveCustomization(event)">
  <div class="field"><label>HERO LABEL</label><input name="heroTag" maxlength="100" value="${esc(s.heroTag)}"></div>
  <div class="field"><label>HERO TITLE</label><input name="heroTitle" maxlength="100" value="${esc(s.heroTitle)}"></div>
  <div class="field"><label>HERO DESCRIPTION</label><textarea name="heroDescription" maxlength="1000">${esc(s.heroDescription)}</textarea></div>
  <div class="field"><label>SHOP TITLE</label><input name="shopTitle" maxlength="100" value="${esc(s.shopTitle)}"></div>
  <div class="field"><label>SHOP DESCRIPTION</label><textarea name="shopDescription" maxlength="1000">${esc(s.shopDescription)}</textarea></div>
  <div class="field"><label>FOOTER TEXT</label><input name="footerText" maxlength="200" value="${esc(s.footerText)}"></div>
  <button class="btn">SAVE CHANGES</button></form><p><button class="btn outline" onclick="showPage('shop')">PREVIEW STORE</button></p>`;
}
async function saveCustomization(e){
  e.preventDefault();const d=new FormData(e.target);
  ["heroTag","heroTitle","heroDescription","shopTitle","shopDescription","footerText"].forEach(k=>state.settings[k]=String(d.get(k)||"").trim());
  await saveState();renderAdmin();notify("Storefront updated.");
}
function settingsHTML(){
  return `<h2>Settings</h2><div class="field"><label>CURRENCY</label><select id="currency">${["TND","EUR","USD","GBP","SAR","AED","DZD","MAD"].map(x=>`<option ${state.settings.currency===x?"selected":""}>${x}</option>`).join("")}</select></div>
  <button class="btn" onclick="saveSettings()">SAVE SETTINGS</button><hr style="border:0;border-top:1px solid #333;margin:25px 0">
  <h3>Backup</h3><div class="row"><button class="btn outline" onclick="exportBackup()">EXPORT</button><button class="btn outline" onclick="$('backupFile').click()">IMPORT</button></div>
  <input id="backupFile" class="hidden" type="file" accept=".json,application/json" onchange="importBackup(event)">
  <p class="muted" style="margin-top:20px">${cloudReady?"Firebase cloud synchronization is active.":"Firebase is not configured; data is limited to this browser."}</p>`;
}
async function saveSettings(){
  state.settings.currency=$("currency").value;await saveState();renderAdmin();notify("Settings saved.");
}
function exportBackup(){
  const url=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:"application/json"}));
  const a=document.createElement("a");a.href=url;a.download="VYRO_01_backup.json";a.click();URL.revokeObjectURL(url);
}
async function importBackup(e){
  const f=e.target.files[0];if(!f)return;
  try{
    const d=JSON.parse(await f.text());
    if(!Array.isArray(d.products)||!Array.isArray(d.orders))throw Error("Invalid backup.");
    if(!confirm("Replace current store data with this backup?"))return;
    state={settings:{...defaults.settings,...(d.settings||{})},products:d.products,orders:d.orders};
    await saveState();renderAdmin();notify("Backup imported.");
  }catch(err){notify(err.message||"Import failed.");}
  finally{e.target.value="";}
}
function loadScript(src){
  return new Promise((resolve,reject)=>{
    const s=document.createElement("script");s.src=src;s.onload=resolve;s.onerror=()=>reject(Error("Firebase SDK failed to load."));document.head.appendChild(s);
  });
}
async function initFirebase(){
  if(!configured){updateNotice();return;}
  try{
    await loadScript(SDK+"firebase-app-compat.js");
    await loadScript(SDK+"firebase-database-compat.js");
    await loadScript(SDK+"firebase-storage-compat.js");
    if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);
    db=firebase.database();storage=firebase.storage();
    const ref=db.ref("vyro01");
    const snap=await ref.once("value");
    const cloud=snap.val();
    if(cloud&&typeof cloud==="object"){
      state={settings:{...defaults.settings,...(cloud.settings||{})},products:Array.isArray(cloud.products)?cloud.products:[],orders:Array.isArray(cloud.orders)?cloud.orders:[]};
    }else{
      await ref.set(state);
    }
    cloudReady=true;saveLocal();renderStore();updateNotice();
    ref.on("value",s=>{
      const d=s.val();if(!d||typeof d!=="object")return;
      lastCloudUpdate=Date.now();
      state={settings:{...defaults.settings,...(d.settings||{})},products:Array.isArray(d.products)?d.products:[],orders:Array.isArray(d.orders)?d.orders:[]};
      saveLocal();renderStore();
      if(loggedIn&&!$("adminPage").classList.contains("hidden"))renderAdmin();
    },err=>{console.error(err);cloudReady=false;updateNotice();});
  }catch(err){console.error("Firebase initialization error:",err);cloudReady=false;updateNotice();}
}
loadLocal();
renderStore();
updateNotice();
initFirebase();
$("passwordOverlay").addEventListener("click",e=>{if(e.target===$("passwordOverlay"))closePassword();});
$("orderOverlay").addEventListener("click",e=>{if(e.target===$("orderOverlay"))closeOrder();});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){
    closePassword();
    closeOrder();
    closeProductDetails();
  }
});
