<!DOCTYPE html>

<html lang="fr">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<meta name="theme-color" content="#176FE5">

<title>Tout de suite — Livraison</title>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>

<style>

:root{--blue:#176fe5;--dark:#1055b5;--light:#edf5ff;--white:#fff;--bg:#f6f8fc;--text:#17243a;--muted:#8491a5;--border:#e8edf5;--green:#18a66a;--red:#e34d5b;--shadow:0 5px 25px #173c7010}

*{box-sizing:border-box;margin:0;padding:0}

body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);padding-bottom:90px}

button,input,textarea,select{font:inherit}

button{cursor:pointer;border:0}

button:disabled{opacity:.45;cursor:not-allowed}

.top{background:white;padding:17px 18px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10;border-bottom:1px solid var(--border)}

.brand{font-size:23px;font-weight:900;letter-spacing:-1px;color:var(--blue)}

.brand span{color:#17243a}

.top-right{display:flex;gap:9px;align-items:center}

.icon-btn{width:39px;height:39px;border-radius:13px;background:var(--light);color:var(--blue);font-size:18px}

.container{max-width:850px;margin:auto;padding:18px}

.page{display:none}.page.active{display:block}

.hero{background:linear-gradient(130deg,#176fe5,#439bff);border-radius:23px;padding:24px;color:white;position:relative;overflow:hidden;margin-bottom:22px}

.hero:after{content:"";position:absolute;width:180px;height:180px;border:30px solid #ffffff19;border-radius:50%;right:-55px;top:-55px}

.hero h1{font-size:29px;line-height:1.2;max-width:260px;margin-bottom:10px}

.hero p{font-size:13px;opacity:.9;margin-bottom:18px}

.hero button{background:white;color:var(--blue);padding:12px 18px;border-radius:12px;font-weight:800}

.section-head{display:flex;justify-content:space-between;align-items:center;margin:23px 0 13px}

.section-head h2{font-size:19px;font-weight:850}

.section-head small{color:var(--blue);cursor:pointer}

.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}

.card{background:white;border:1px solid var(--border);border-radius:17px;overflow:hidden;box-shadow:var(--shadow)}

.card-img{width:100%;height:125px;object-fit:cover;background:var(--light)}

.card-body{padding:11px}

.card h3{font-size:14px;margin-bottom:5px}

.muted{color:var(--muted);font-size:12px}

.price{font-weight:900;color:var(--blue);font-size:15px}

.card-actions{display:flex;justify-content:space-between;align-items:center;margin-top:10px}

.add{background:var(--blue);color:white;border-radius:10px;padding:8px 13px;font-weight:800}

.pill{display:inline-block;padding:5px 9px;border-radius:20px;background:var(--light);color:var(--blue);font-size:11px;font-weight:750}

.categories{display:flex;gap:9px;overflow-x:auto;padding-bottom:8px}

.cat{white-space:nowrap;background:white;border:1px solid var(--border);border-radius:13px;padding:11px 15px;color:var(--text);font-weight:700}

.cat.active{background:var(--blue);color:white;border-color:var(--blue)}

.search{width:100%;padding:14px 15px;background:white;border:1px solid var(--border);border-radius:14px;outline:none;margin:10px 0 15px}

.search:focus,input:focus,textarea:focus,select:focus{border-color:var(--blue)!important}

.bottom{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid var(--border);display:flex;justify-content:space-around;padding:9px 3px max(10px,env(safe-area-inset-bottom));z-index:20}

.nav{background:transparent;color:var(--muted);font-size:10px;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:55px}

.nav b{font-size:20px}.nav.active{color:var(--blue);font-weight:850}

.panel{background:white;border:1px solid var(--border);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}

.panel h3{margin-bottom:13px}

.field{display:flex;flex-direction:column;gap:6px;margin:11px 0}

.field label{font-size:12px;font-weight:800;color:#52647c}

.field input,.field textarea,.field select{width:100%;border:1px solid var(--border);border-radius:11px;padding:12px;background:#fff;outline:none;color:var(--text)}

.field textarea{min-height:80px;resize:vertical}

.primary{background:var(--blue);color:white;padding:13px 17px;border-radius:12px;font-weight:850;width:100%}

.secondary{background:var(--light);color:var(--blue);padding:11px 14px;border-radius:11px;font-weight:800}

.danger{background:#fff0f1;color:var(--red);padding:9px 12px;border-radius:10px;font-weight:800}

.success{color:var(--green)}

.row{display:flex;gap:10px;align-items:center}

.between{display:flex;justify-content:space-between;align-items:center;gap:10px}

.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}

.stat{background:var(--light);padding:15px;border-radius:15px}

.stat strong{font-size:22px;color:var(--blue);display:block}

.stat small{color:var(--muted)}

.list-item{padding:12px 0;border-bottom:1px solid var(--border)}

.list-item:last-child{border:0}

.avatar{width:52px;height:52px;object-fit:cover;border-radius:14px;background:var(--light)}

.empty{text-align:center;padding:35px 15px;color:var(--muted)}

.empty b{font-size:32px;display:block;margin-bottom:8px}

.modal{position:fixed;inset:0;background:#07162b88;z-index:50;display:none;align-items:flex-end;justify-content:center}

.modal.show{display:flex}

.modal-box{background:white;width:100%;max-width:600px;max-height:88vh;overflow:auto;border-radius:24px 24px 0 0;padding:22px}

.close{float:right;background:var(--light);color:var(--blue);border-radius:50%;width:33px;height:33px}

.tag{background:#eef9f3;color:var(--green);padding:5px 9px;border-radius:15px;font-size:11px;font-weight:800}

.hidden{display:none!important}

.notice{background:#fff8e8;color:#92620c;padding:12px;border-radius:12px;font-size:12px;margin-bottom:12px}

.admin-tabs{display:flex;gap:7px;overflow:auto;margin-bottom:15px}

.admin-tab{padding:10px 13px;border-radius:11px;background:white;border:1px solid var(--border);white-space:nowrap;font-weight:750;font-size:12px}

.admin-tab.active{background:var(--blue);color:white}

.badge-count{background:#eaf2ff;color:var(--blue);border-radius:30px;padding:3px 8px;font-size:11px;font-weight:800}

.product-line{display:flex;align-items:center;gap:10px}

.product-line img{width:55px;height:55px;object-fit:cover;border-radius:11px}

.qty{display:flex;align-items:center;gap:9px}

.qty button{width:27px;height:27px;border-radius:8px;background:var(--light);color:var(--blue);font-weight:900}

#toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:#17243a;color:white;padding:12px 18px;border-radius:12px;z-index:100;display:none;max-width:90%;font-size:13px}

@media(min-width:650px){.grid{grid-template-columns:repeat(3,1fr)}.card-img{height:155px}.modal{align-items:center}.modal-box{border-radius:22px}}

</style>

</head>

<body>

<header class="top">

 <div class="brand">Tout <span>de suite.</span></div>

 <div class="top-right">

  <button class="icon-btn" onclick="openCart()">🛒 <span id="cartCount">0</span></button>

  <button class="icon-btn" onclick="showPage('profile')">👤</button>

 </div>

</header>

<main class="container">

<section id="home" class="page active">

 <div class="hero">

  <h1>Tout ce dont vous avez besoin.</h1>

  <p>Vos envies, vos courses et vos repas livrés chez vous.</p>

  <button onclick="document.getElementById('homeProducts').scrollIntoView({behavior:'smooth'})">Découvrir maintenant →</button>

 </div>

 <input class="search" id="homeSearch" placeholder="🔍  Rechercher un plat, un produit..." oninput="renderHome()">

 <div class="section-head"><h2>🔥 Offres spéciales</h2></div>

 <div id="offers" class="grid"></div>

 <div class="section-head"><h2>🍽️ Restaurants</h2><small onclick="filterHome('restaurant')">Voir tout</small></div>

 <div id="restaurants" class="grid"></div>

 <div class="section-head"><h2>🛍️ Nos produits</h2></div>

 <div id="homeCategories" class="categories"></div>

 <div id="homeProducts" class="grid"></div>

</section>

<section id="everything" class="page">

 <h2 style="font-size:25px;margin:8px 0">Everything.</h2>

 <p class="muted">Tous vos achats au même endroit.</p>

 <input class="search" id="everythingSearch" placeholder="🔍 Rechercher..." oninput="renderEverything()">

 <div id="categories" class="categories"></div>

 <div class="section-head"><h2 id="categoryTitle">Tous les produits</h2></div>

 <div id="everythingProducts" class="grid"></div>

</section>

<section id="profile" class="page">

 <h2 style="font-size:25px;margin:8px 0 5px">Votre profil</h2>

 <p class="muted" style="margin-bottom:18px">Rejoignez l'équipe Tout de suite.</p>

 <div id="profileContent"></div>

</section>

<section id="work" class="page"><div id="workContent"></div></section>

<section id="staff" class="page"><div id="staffContent"></div></section>

</main>

<nav class="bottom">

 <button class="nav active" data-page="home" onclick="showPage('home')"><b>⌂</b>HOME</button>

 <button class="nav" data-page="everything" onclick="showPage('everything')"><b>▦</b>EVERYTHING</button>

 <button class="nav" data-page="profile" onclick="showPage('profile')"><b>♙</b>PROFILE</button>

 <button class="nav" data-page="work" onclick="showPage('work')"><b>🚴</b>WORK</button>

 <button class="nav" data-page="staff" onclick="showPage('staff')"><b>⚙</b>STAFF</button>

</nav>

<div id="modal" class="modal" onclick="if(event.target===this)closeModal()">

 <div class="modal-box" id="modalContent"></div>

</div>

<div id="toast"></div>

<script>

/* FIREBASE */

const firebaseConfig={

 apiKey:"AIzaSyBg7mf9-RghLNKwspal_2d9jKHG4VMHy-w",

 authDomain:"vyro-7d190.firebaseapp.com",

 databaseURL:"https://vyro-7d190-default-rtdb.europe-west1.firebasedatabase.app",

 projectId:"vyro-7d190",

 storageBucket:"vyro-7d190.firebasestorage.app",

 messagingSenderId:"377590792321",

 appId:"1:377590792321:web:f15a244aa0db16a7884d80"

};

firebase.initializeApp(firebaseConfig);

const db=firebase.database();

const auth=firebase.auth();

const ADMIN_PASSWORD="RASLEN199";

const ROOT="ToutDeSuite";

let data={

 settings:{name:"Tout de suite",deliveryPrice:3,currency:"DT"},

 products:[],restaurants:[],categories:[

  {id:"c1",name:"Fruits",emoji:"🍎"},

  {id:"c2",name:"Légumes",emoji:"🥦"},

  {id:"c3",name:"Épicerie",emoji:"🛒"},

  {id:"c4",name:"Boulangerie",emoji:"🥖"},

  {id:"c5",name:"Viande",emoji:"🥩"},

  {id:"c6",name:"Boissons",emoji:"🥤"},

  {id:"c7",name:"Maison",emoji:"🧹"}

 ],

 workers:[],applications:[],orders:[],offers:[],notifications:[]

};

let cart=[];

let selectedCategory="all";

let selectedAdminTab="dashboard";

let currentWorker=null;

let isAdmin=false;

let activePage="home";

let dbReady=false;

let initialized=false;

let currentFilter="all";

const $=id=>document.getElementById(id);

const money=n=>Number(n||0).toFixed(2)+" DT";

const safe=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const imgFallback="https://placehold.co/500x350/eaf2ff/176fe5?text=Tout+de+suite";

const imageUrl=s=>s||imgFallback;

const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);

/* تحويل بيانات Firebase إلى قوائم JavaScript */

function normalizeCollection(value){

 if(Array.isArray(value))return value.filter(Boolean);

 if(value&&typeof value==="object")return Object.values(value).filter(Boolean);

 return [];

}

function toast(msg){

 const t=$("toast");t.textContent=msg;t.style.display="block";

 clearTimeout(window.toastTimer);

 window.toastTimer=setTimeout(()=>t.style.display="none",3000);

}

function openModal(html){$("modalContent").innerHTML=html;$("modal").classList.add("show")}

function closeModal(){$("modal").classList.remove("show")}

function showPage(page){

 activePage=page;

 document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));

 $(page).classList.add("active");

 document.querySelectorAll(".nav").forEach(n=>n.classList.toggle("active",n.dataset.page===page));

 if(page==="home")renderHome();

 if(page==="everything")renderEverything();

 if(page==="profile")renderProfile();

 if(page==="work")renderWork();

 if(page==="staff")renderStaff();

 window.scrollTo({top:0,behavior:"smooth"});

}

/* حفظ آمن يحافظ على بنية Firebase */

function collectionToObject(list){

 const result={};

 (Array.isArray(list)?list:[]).filter(Boolean).forEach(item=>{

  if(item.id)result[item.id]=item;

 });

 return result;

}

function save(){

 if(!dbReady)return Promise.reject(new Error("Firebase n'est pas connecté."));

 const payload={

  settings:data.settings,

  products:collectionToObject(data.products),

  restaurants:collectionToObject(data.restaurants),

  categories:collectionToObject(data.categories),

  workers:collectionToObject(data.workers),

  applications:collectionToObject(data.applications),

  orders:collectionToObject(data.orders),

  offers:collectionToObject(data.offers),

  notifications:collectionToObject(data.notifications)

 };

 return db.ref(ROOT).update(payload).catch(e=>{

  toast("Erreur Firebase : "+e.message);

  throw e;

 });

}

/* الاستماع إلى قاعدة البيانات */

function subscribe(){

 db.ref(ROOT).on("value",snap=>{

  if(snap.exists()){

   const d=snap.val()||{};

   data.settings={

    name:"Tout de suite",

    deliveryPrice:3,

    currency:"DT",

    ...(d.settings||{})

   };

   ["products","restaurants","categories","workers","applications","orders","offers","notifications"].forEach(k=>{

    data[k]=normalizeCollection(d[k]);

   });

  }else{

   data.settings={name:"Tout de suite",deliveryPrice:3,currency:"DT"};

   data.products=[];

   data.restaurants=[];

   data.workers=[];

   data.applications=[];

   data.orders=[];

   data.offers=[];

   data.notifications=[];

  }

  dbReady=true;

  initialized=true;

  renderHome();

  renderEverything();

  renderProfile();

  if(activePage==="work")renderWork();

  if(activePage==="staff")renderStaff();

  console.log("Firebase connecté — données chargées :",data);

 },error=>{

  dbReady=false;

  toast("Erreur Firebase : "+error.message);

  console.error("Firebase Database:",error);

 });

}

auth.signInAnonymously()

 .then(()=>{

  console.log("Firebase Auth connecté.");

  subscribe();

 })

 .catch(e=>{

  dbReady=false;

  toast("Connexion Firebase impossible : "+e.message);

  console.error("Firebase Auth:",e);

 });

if("Notification"in window){}

function askNotifications(){

 if("Notification"in window&&Notification.permission==="default")Notification.requestPermission();

}

function notify(title,body){

 if("Notification"in window&&Notification.permission==="granted"){

  try{new Notification(title,{body})}catch(e){}

 }

}

function notifyWorker(id,title,message){

 data.notifications.unshift({id:uid(),workerId:id,title,message,createdAt:Date.now(),read:false});

}

/* IMAGE */

function readImage(file,callback){

 if(!file)return;

 const reader=new FileReader();

 reader.onload=e=>{

  const image=new Image();

  image.onload=()=>{

   const canvas=document.createElement("canvas");

   const scale=Math.min(1,800/Math.max(image.width,image.height));

   canvas.width=image.width*scale;

   canvas.height=image.height*scale;

   canvas.getContext("2d").drawImage(image,0,0,canvas.width,canvas.height);

   callback(canvas.toDataURL("image/jpeg",.68));

  };

  image.onerror=()=>toast("Impossible de lire cette image.");

  image.src=e.target.result;

 };

 reader.onerror=()=>toast("Erreur lors de la lecture de l'image.");

 reader.readAsDataURL(file);

}

function imageInput(id,label="Photo"){

 return `<div class="field"><label>${label}</label><input type="file" id="${id}" accept="image/*"></div>`;

}

function fileToData(file){

 return new Promise((resolve,reject)=>{

  if(!file){resolve("");return}

  readImage(file,result=>result?resolve(result):reject(new Error("Image invalide")));

 });

}

/* HOME */

function productCard(p){

 return `<article class="card">

 <img class="card-img" src="${imageUrl(p.image)}" onerror="this.src=imgFallback">

 <div class="card-body">

  <h3>${safe(p.name)}</h3>

  <div class="muted">${safe(p.description||p.category||"")}</div>

  <div class="card-actions"><span class="price">${money(p.price)}</span>

  <button class="add" onclick="addToCart('${p.id}')">+</button></div>

 </div></article>`;

}

function restaurantCard(r){

 return `<article class="card" onclick="openRestaurant('${r.id}')">

 <img class="card-img" src="${imageUrl(r.image)}" onerror="this.src=imgFallback">

 <div class="card-body"><h3>${safe(r.name)}</h3>

 <div class="muted">${safe(r.description||"Restaurant")}</div>

 <div class="card-actions"><span class="pill">🍽️ Restaurant</span><span class="muted">${money(r.deliveryPrice??data.settings.deliveryPrice)}</span></div>

 </div></article>`;

}

function renderHome(){

 if(!$("home"))return;

 const q=($("homeSearch")?.value||"").toLowerCase();

 $("offers").innerHTML=data.offers

  .filter(o=>o.active!==false)

  .map(o=>`<article class="card">

   <img class="card-img" src="${imageUrl(o.image)}" onerror="this.src=imgFallback">

   <div class="card-body"><span class="pill">OFFRE</span><h3>${safe(o.name)}</h3><p class="muted">${safe(o.description||"")}</p></div>

  </article>`).join("");

 $("restaurants").innerHTML=data.restaurants

  .filter(r=>r.active!==false&&(!q||String(r.name||"").toLowerCase().includes(q)))

  .map(restaurantCard).join("")||'<div class="empty">Aucun restaurant disponible.</div>';

 $("homeCategories").innerHTML=data.categories

  .map(c=>`<button class="cat" onclick="goCategory('${c.id}')">${safe(c.emoji||"▦")} ${safe(c.name)}</button>`).join("");

 $("homeProducts").innerHTML=data.products

  .filter(p=>p.active!==false&&(!q||String(p.name||"").toLowerCase().includes(q)||String(p.category||"").toLowerCase().includes(q)))

  .slice(0,12).map(productCard).join("")||'<div class="empty">Aucun produit disponible.</div>';

}

function filterHome(type){showPage("home")}

function goCategory(id){selectedCategory=id;showPage("everything")}

function renderEverything(){

 $("categories").innerHTML=`<button class="cat ${selectedCategory==="all"?"active":""}" onclick="selectCategory('all')">Tout</button>`+

 data.categories.map(c=>`<button class="cat ${selectedCategory===c.id?"active":""}" onclick="selectCategory('${c.id}')">${safe(c.emoji||"")} ${safe(c.name)}</button>`).join("");

 const c=data.categories.find(x=>x.id===selectedCategory);

 $("categoryTitle").textContent=selectedCategory==="all"?"Tous les produits":(c?.name||"Produits");

 const q=($("everythingSearch")?.value||"").toLowerCase();

 const products=data.products.filter(p=>

  p.active!==false&&

  (selectedCategory==="all"||p.category===selectedCategory)&&

  (!q||String(p.name||"").toLowerCase().includes(q))

 );

 $("everythingProducts").innerHTML=products.map(productCard).join("")||

  '<div class="empty"><b>🛍️</b>Aucun produit dans cette catégorie.</div>';

}

function selectCategory(id){selectedCategory=id;renderEverything()}

function openRestaurant(id){

 const r=data.restaurants.find(x=>x.id===id);

 if(!r)return;

 const items=data.products.filter(p=>p.restaurantId===id&&p.active!==false);

 openModal(`<button class="close" onclick="closeModal()">×</button>

 <img src="${imageUrl(r.image)}" style="width:100%;height:180px;object-fit:cover;border-radius:15px;margin:12px 0">

 <h2>${safe(r.name)}</h2><p class="muted">${safe(r.description||"")}</p>

 <p style="margin:10px 0">Livraison : <b class="price">${money(r.deliveryPrice??data.settings.deliveryPrice)}</b></p>

 <div class="section-head"><h3>Menu</h3></div>

 <div class="grid">${items.map(productCard).join("")||"Aucun plat disponible."}</div>`);

}

/* CART */

function addToCart(id){

 const p=data.products.find(x=>x.id===id);

 if(!p)return;

 const existing=cart.find(x=>x.id===id);

 if(existing)existing.qty++;

 else cart.push({id:p.id,name:p.name,price:Number(p.price),qty:1,restaurantId:p.restaurantId||null});

 updateCart();

 toast("Ajouté au panier");

}

function updateCart(){

 $("cartCount").textContent=cart.reduce((s,x)=>s+x.qty,0);

}

function cartTotal(){return cart.reduce((s,x)=>s+x.price*x.qty,0)}

function openCart(){

 if(!cart.length){

  openModal('<button class="close" onclick="closeModal()">×</button><div class="empty"><b>🛒</b>Votre panier est vide.</div>');

  return;

 }

 const restaurantIds=[...new Set(cart.map(x=>x.restaurantId).filter(Boolean))];

 const delivery=restaurantIds.length?

  Math.max(...restaurantIds.map(id=>Number(data.restaurants.find(r=>r.id===id)?.deliveryPrice??data.settings.deliveryPrice))):

  Number(data.settings.deliveryPrice);

 openModal(`<button class="close" onclick="closeModal()">×</button><h2>Votre panier 🛒</h2>

 <div style="margin:15px 0">${cart.map((x,i)=>`<div class="list-item between">

 <div><b>${safe(x.name)}</b><div class="muted">${money(x.price)} / unité</div></div>

 <div class="qty"><button onclick="changeQty(${i},-1)">−</button>${x.qty}<button onclick="changeQty(${i},1)">+</button></div>

 </div>`).join("")}</div>

 <div class="list-item between">Sous-total <b>${money(cartTotal())}</b></div>

 <div class="list-item between">Livraison <b>${money(delivery)}</b></div>

 <div class="list-item between"><b>Total</b><strong class="price">${money(cartTotal()+delivery)}</strong></div>

 <h3 style="margin-top:20px">Informations de livraison</h3>

 <div class="field"><label>Nom complet</label><input id="orderName" placeholder="Votre nom"></div>

function changeQty(i,d){

 cart[i].qty+=d;

 if(cart[i].qty<=0)cart.splice(i,1);

 updateCart();

 openCart();

}

async function submitOrder(delivery){

 const name=$("orderName").value.trim();

 const phone=$("orderPhone").value.trim();

 const address=$("orderAddress").value.trim();

 if(!name||!phone||!address){toast("Remplissez tous les champs obligatoires.");return}

 if(!dbReady){toast("Connexion en cours.");return}

 const order={

  id:uid(),

  customerName:name,

  phone,

  address,

  note:$("orderNote").value,

  items:cart.map(x=>({...x})),

  subtotal:cartTotal(),

  deliveryPrice:delivery,

  total:cartTotal()+delivery,

  status:"pending",

  workerId:null,

  createdAt:Date.now(),

  customerUid:auth.currentUser?.uid||""

 };

 try{

  await db.ref(ROOT+"/orders/"+order.id).set(order);

  cart=[];

  updateCart();

  closeModal();

  toast("Commande envoyée avec succès !");

  notify("Commande confirmée","Votre demande a été enregistrée.");

 }catch(e){

  toast("Erreur : "+e.message);

 }

}

async function submitApplication(){

 const firstName=$("appFirst").value.trim();

 const lastName=$("appLast").value.trim();

 const age=Number($("appAge").value);

 const phone=$("appPhone").value.trim();

 const moto=$("appMoto").value.trim();

 if(!firstName||!lastName||!age||!phone||!moto){toast("Veuillez remplir les champs obligatoires.");return}

 if(age<16){toast("Âge non admissible.");return}

 if(!dbReady){toast("Connexion Firebase en cours.");return}

 const uidUser=auth.currentUser?.uid;

 if(!uidUser)return;

 try{

  let image="",motoImage="";

  const f=$("appImage").files[0];

  const mf=$("appMotoImage").files[0];

  if(f)image=await fileToData(f);

  if(mf)motoImage=await fileToData(mf);

  const app={

   id:uid(),

   uid:uidUser,

   firstName,lastName,age,phone,moto,image,motoImage,

   note:$("appNote").value,

   status:"pending",

   createdAt:Date.now()

  };

  await db.ref(ROOT+"/applications/"+app.id).set(app);

  toast("Candidature envoyée !");

  notify("Candidature envoyée","Votre demande est en attente.");

  renderProfile();

 }catch(e){

  toast("Erreur : "+e.message);

 }

}

async function acceptOrder(id){

 if(!currentWorker)return;

 const ref=db.ref(ROOT+"/orders/"+id);

 try{

  const result=await ref.transaction(o=>{

   if(!o||o.status!=="pending"||o.workerId)return;

   o.workerId=currentWorker.id;

   o.status="accepted";

   o.acceptedAt=Date.now();

   return o;

  });

  if(!result.committed){toast("Cette commande a déjà été prise.");return}

  toast("Commande acceptée !");

  notify("Nouvelle commande","Vous avez accepté une commande.");

  renderWork();

 }catch(e){

  toast(e.message);

 }

}

async function updateOrderStatus(id,status){

 const o=data.orders.find(x=>x.id===id);

 if(!o||!currentWorker||o.workerId!==currentWorker.id)return;

 const update={status,updatedAt:Date.now()};

 if(status==="delivered"){

  update.deliveredAt=Date.now();

  update.workerEarning=Number(o.workerEarning??(Number(o.deliveryPrice||data.settings.deliveryPrice)*0.8));

 }

 try{

  await db.ref(ROOT+"/orders/"+id).update(update);

  toast("Statut mis à jour.");

 }catch(e){

  toast("Erreur : "+e.message);

 }

}

/* ADMIN ACTIONS */

async function approveApplication(id){

 const a=data.applications.find(x=>x.id===id);

 if(!a)return;

 const pass=prompt("Définir le mot de passe du livreur :");

 if(!pass||pass.length<6){toast("Mot de passe trop court (6 caractères minimum).");return}

 const w={...a,id:uid(),password:pass,active:true,joinedAt:Date.now()};

 delete w.status;

 try{

  await db.ref(ROOT+"/workers/"+w.id).set(w);

  await db.ref(ROOT+"/applications/"+id).update({status:"accepted",workerId:w.id});

  toast("Livreur accepté.");

 }catch(e){

  toast("Erreur : "+e.message);

 }

}

async function rejectApplication(id){

 if(!confirm("Refuser cette candidature ?"))return;

 try{

  await db.ref(ROOT+"/applications/"+id).update({status:"rejected"});

  toast("Candidature refusée.");

 }catch(e){toast("Erreur : "+e.message)}

}

async function toggleWorker(id){

 const w=data.workers.find(x=>x.id===id);

 const active=w.active===false;

 try{

  await db.ref(ROOT+"/workers/"+id).update({active});

  toast(active?"Compte activé":"Compte désactivé");

 }catch(e){toast("Erreur : "+e.message)}

}

async function saveProduct(id){

 const name=$("pName").value.trim();

 const price=Number($("pPrice").value);

 if(!name||!Number.isFinite(price)||price<0){

  toast("Nom et prix valides obligatoires.");

  return;

 }

 if(!dbReady){toast("Connexion Firebase en cours.");return}

 const old=data.products.find(x=>x.id===id);

 let image=old?.image||"";

 try{

  const f=$("pImage").files[0];

  if(f)image=await fileToData(f);

  const p={

   id:id||uid(),

   name,

   price,

   description:$("pDesc").value,

   category:$("pCategory").value,

   restaurantId:$("pRestaurant").value,

   image,

   active:true

  };

  await db.ref(ROOT+"/products/"+p.id).set(p);

  closeModal();

  toast("Produit enregistré.");

 }catch(e){toast("Erreur : "+e.message)}

}

/* INITIALISATION DE LA STRUCTURE SANS ECRASER LES DONNEES */

async function initializeDatabase(){

 try{

  const snapshot=await db.ref(ROOT).once("value");

  if(!snapshot.exists()){

   const initial={

    settings:data.settings,

    categories:collectionToObject(data.categories),

    products:{},

    restaurants:{},

    workers:{},

    applications:{},

    orders:{},

    offers:{},

    notifications:{}

   };

   await db.ref(ROOT).set(initial);

  }

 }catch(e){

  console.error("Initialisation Firebase:",e);

 }

}

initializeDatabase();
