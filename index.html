

<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="theme-color" content="#050609">

<title>VYRO — Beyond The Ordinary</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

:root{

--bg:#050609;--panel:#0c101a;--blue:#168bff;

--light:#80c4ff;--text:#f5f7ff;--muted:#8993a7;

--border:rgba(120,170,255,.16);

}

*{box-sizing:border-box;margin:0;padding:0}

body{background:var(--bg);color:var(--text);font-family:Inter,Arial,sans-serif;min-height:100vh;overflow-x:hidden}

button,input,select,textarea{font:inherit}

button{cursor:pointer;color:inherit}

#lightning{position:fixed;inset:0;pointer-events:none;z-index:-1;overflow:hidden}

#lightning:before{content:"";position:absolute;width:750px;height:750px;top:-300px;left:50%;transform:translateX(-50%);background:radial-gradient(circle,rgba(0,95,255,.18),transparent 68%);filter:blur(25px)}

#lightning:after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(0,111,255,.035) 50%,transparent 65%)}

.hidden{display:none!important}

button,.glass{border:1px solid var(--border);background:rgba(15,24,42,.65);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-radius:17px}

button{transition:.25s}

button:hover{border-color:#379cff;box-shadow:0 0 25px #087aff30;transform:translateY(-2px)}

.logo{font-size:clamp(48px,10vw,100px);font-weight:900;letter-spacing:12px;text-shadow:0 0 35px #168bff75}

.blue{color:var(--light)}

.muted{color:var(--muted)}

.small{font-size:12px;color:var(--muted)}

.container{width:min(1150px,92%);margin:auto}

.home{min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:30px 15px}

.home-content{width:100%;max-width:650px}

.tagline{letter-spacing:5px;font-size:11px;color:#8cbaff;margin:15px 0 55px}

.home-buttons{display:grid;grid-template-columns:1fr 1fr;gap:16px}

.home-btn{padding:24px 12px;display:flex;flex-direction:column;align-items:center;gap:13px;font-weight:700;letter-spacing:1px;font-size:12px}

.home-btn .ico{font-size:28px;color:#71baff}

.home-btn.primary{background:linear-gradient(135deg,#0b2a51,#10213a);border-color:#258bff}

.footer{margin-top:70px;font-size:10px;letter-spacing:4px;color:#53647d}

header{position:sticky;top:0;z-index:10;background:#050609dc;backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}

.nav{height:72px;display:flex;align-items:center;justify-content:space-between;gap:10px}

.nav-logo{font-size:25px;font-weight:900;letter-spacing:5px}

.nav-actions{display:flex;gap:9px}

.icon-btn{width:43px;height:43px;display:grid;place-items:center;font-size:17px}

.section{padding:45px 0}

.section-title{font-size:clamp(25px,5vw,42px);font-weight:800;letter-spacing:-1.5px}

.subtitle{font-size:12px;color:var(--muted);margin-top:9px;letter-spacing:2px}

.hero{padding:55px 0 38px;text-align:center}

.hero .logo{font-size:54px}

.products-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:30px}

.product-card{overflow:hidden;cursor:pointer;border:1px solid var(--border);border-radius:20px;background:linear-gradient(145deg,#121a2a,#080a10);transition:.3s}

.product-card:hover{transform:translateY(-6px);border-color:#268bff}

.product-card img{width:100%;aspect-ratio:4/5;object-fit:cover;background:#101522;display:block}

.product-info{padding:16px}

.product-name{font-weight:700;font-size:14px}

.price{color:#80bdff;font-weight:700;margin-top:8px}

.product-detail{display:grid;grid-template-columns:1fr 1fr;gap:35px;align-items:start}

.detail-image{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:22px;border:1px solid var(--border);background:#101522}

.detail-info{padding:10px 0}

.detail-info h1{font-size:clamp(26px,5vw,42px);margin-bottom:12px}

.description{color:#a0aabc;line-height:1.8;font-size:14px;margin:18px 0}

.field{margin:18px 0}

.field label{display:block;font-size:11px;letter-spacing:1px;color:#9eacc4;margin-bottom:9px}

.field input,.field select,.field textarea,.search{

width:100%;background:#0b101b;border:1px solid var(--border);border-radius:12px;padding:14px;color:white;outline:none

}

.field input:focus,.field select:focus,.field textarea:focus{border-color:#258bff}

.field select option{background:#101522}

.colors,.sizes{display:flex;gap:9px;flex-wrap:wrap}

.color-option,.size-option{padding:10px 15px;border:1px solid var(--border);border-radius:10px;background:#101522;font-size:12px}

.color-option.active,.size-option.active{border-color:#329bff;background:#102b4c}

.stock{font-size:12px;margin-top:15px}

.stock.low{color:#ff4d59}.stock.medium{color:#ffad42}.stock.high{color:#42d99b}

.primary-btn{width:100%;padding:16px;background:linear-gradient(110deg,#0864ca,#168fff);border:0;border-radius:13px;color:white;font-weight:800;letter-spacing:1px;margin-top:15px}

.secondary-btn{padding:12px 17px}

.back-btn{padding:11px 17px;margin-bottom:25px}

.qty{display:flex;align-items:center;gap:15px}

.qty button{width:37px;height:37px}

.checkout{max-width:650px;margin:auto}

.checkout h2{margin-bottom:25px}

.checkout-summary{padding:18px;margin-bottom:25px;border-radius:15px;background:#0d1523;border:1px solid var(--border)}

.checkout-summary img{width:75px;height:90px;object-fit:cover;border-radius:9px}

.checkout-summary .row{display:flex;gap:15px;align-items:center}

.admin-layout{display:grid;grid-template-columns:220px 1fr;gap:25px}

.sidebar{height:max-content;padding:15px;display:flex;flex-direction:column;gap:9px}

.side-btn{text-align:left;padding:14px;background:transparent;border:1px solid transparent;font-size:12px}

.side-btn.active{background:#102747;border-color:#1d75cf}

.admin-content{min-width:0}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:25px 0}

.stat{padding:20px;border:1px solid var(--border);border-radius:16px;background:#0c1220}

.stat p{font-size:11px;color:var(--muted)}

.stat h2{font-size:26px;margin-top:12px}

.admin-panel{padding:22px;border:1px solid var(--border);background:#0a101b;border-radius:18px;margin-top:20px}

.admin-panel h3{margin-bottom:20px}

.table-wrap{overflow-x:auto}

table{width:100%;border-collapse:collapse;min-width:650px;font-size:12px}

th,td{text-align:left;padding:15px 10px;border-bottom:1px solid var(--border)}

th{color:#80baff}

.status{padding:6px 9px;border-radius:20px;background:#132c48;color:#81bdff;font-size:10px}

.status.done{background:#103324;color:#51e39b}

.status.cancel{background:#391b23;color:#ff7985}

.action{padding:8px 11px;font-size:11px;margin:2px}

.image-preview{width:65px;height:65px;object-fit:cover;border-radius:9px}

.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.color-entry{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0;padding:13px;border:1px solid var(--border);border-radius:12px}

.login-box{max-width:400px;margin:12vh auto;padding:30px;text-align:center}

.login-box h2{margin-bottom:25px}

.modal{position:fixed;inset:0;background:#000b;z-index:50;display:flex;align-items:center;justify-content:center;padding:15px}

.modal-inner{width:min(550px,100%);max-height:90vh;overflow:auto;background:#0b111e;border:1px solid #2864a1;border-radius:22px;padding:25px}

.close{float:right;padding:8px 12px}

.empty{text-align:center;color:var(--muted);padding:50px 15px}

.notice{font-size:12px;color:#ffba61;margin-top:15px;line-height:1.7}

hr{border:0;border-top:1px solid var(--border);margin:20px 0}

@media(max-width:800px){

.products-grid{grid-template-columns:repeat(2,1fr);gap:12px}

.product-detail{grid-template-columns:1fr;gap:20px}

.detail-image{max-height:480px;object-fit:contain}

.admin-layout{grid-template-columns:1fr}

.sidebar{display:grid;grid-template-columns:repeat(3,1fr)}

.side-btn{text-align:center;padding:11px 4px;font-size:10px}

.stats{grid-template-columns:repeat(2,1fr)}

}

@media(max-width:450px){

.products-grid{gap:10px}

.product-info{padding:11px}

.product-name{font-size:12px}

.home-buttons{gap:10px}

.home-btn{padding:19px 7px}

.form-grid{grid-template-columns:1fr}

}

</style>

</head>

<body>

<div id="lightning"></div>

<!-- HOME -->

<section id="home" class="home">

<div class="home-content">

<div class="logo">VYRO</div>

<div class="tagline">BEYOND THE ORDINARY</div>

<div class="home-buttons">

<button class="home-btn" onclick="showLogin()">

<span class="ico">⚙</span>

PARAMETER

</button>

<button class="home-btn primary" onclick="showShop()">

<span class="ico">◈</span>

START SHOPPING

</button>

</div>

<div class="footer">DESIGNED FOR THE DIFFERENT</div>

</div>

</section>

<!-- SHOP -->

<section id="shop" class="hidden">

<header><div class="container nav">

<div class="nav-logo">VYRO<span class="blue">.</span></div>

<div class="nav-actions">

<button class="icon-btn" onclick="showCart()">♧</button>

<button class="icon-btn" onclick="goHome()">⌂</button>

</div>

</div></header>

<div class="container">

<div id="catalog">

<div class="hero">

<div class="logo">VYRO</div>

<p class="subtitle">DISCOVER YOUR NEXT DIMENSION</p>

</div>

<div class="section">

<div class="section-title">THE COLLECTION<span class="blue">.</span></div>

<p class="subtitle">EXCLUSIVE PIECES · LIMITED QUANTITIES</p>

<div id="products" class="products-grid"></div>

</div>

</div>

<div id="productView" class="section hidden"></div>

<div id="checkoutView" class="section hidden"></div>

<div id="cartView" class="section hidden"></div>

</div>

</section>

<!-- LOGIN -->

<section id="login" class="hidden container">

<div class="glass login-box">

<div class="logo" style="font-size:43px">VYRO</div>

<p class="subtitle">ADMINISTRATOR ACCESS</p>

<h2 style="margin-top:30px">Welcome Back</h2>

<div class="field"><input id="adminPassword" type="password" placeholder="Enter access password" onkeydown="if(event.key==='Enter')login()"></div>

<button class="primary-btn" onclick="login()">UNLOCK DASHBOARD</button>

<button class="secondary-btn" onclick="goHome()" style="margin-top:15px">BACK</button>

<p id="loginError" class="notice hidden">Incorrect password.</p>

</div>

</section>

<!-- ADMIN -->

<section id="admin" class="hidden">

<header><div class="container nav">

<div class="nav-logo">VYRO <span class="blue">CONTROL</span></div>

<button class="secondary-btn" onclick="goHome()">LOG OUT ↗</button>

</div></header>

<div class="container section">

<div class="admin-layout">

<aside class="glass sidebar">

<button class="side-btn active" onclick="adminTab('dashboard',this)">◈ Dashboard</button>

<button class="side-btn" onclick="adminTab('orders',this)">▤ Orders</button>

<button class="side-btn" onclick="adminTab('inventory',this)">◫ Products</button>

<button class="side-btn" onclick="adminTab('add',this)">＋ Add Product</button>

<button class="side-btn" onclick="adminTab('settings',this)">⚙ Settings</button>

</aside>

<div class="admin-content">

<div id="admin-dashboard"></div>

<div id="admin-orders" class="hidden"></div>

<div id="admin-inventory" class="hidden"></div>

<div id="admin-add" class="hidden"></div>

<div id="admin-settings" class="hidden"></div>

</div>

</div>

</div>

</section>

<div id="orderModal" class="modal hidden">

<div class="modal-inner" id="modalContent"></div>

</div>

<script>

const ADMIN_PASSWORD="JASSER 09";

const $=id=>document.getElementById(id);

const load=(key,def)=>{try{return JSON.parse(localStorage.getItem(key))??def}catch{return def}};

const save=(key,value)=>localStorage.setItem(key,JSON.stringify(value));

let products=load("vyro_products",[

{id:1,name:"VYRO ESSENTIAL HOODIE",price:89,description:"Premium oversized streetwear hoodie. Designed for those who move differently.",initial:30,stock:30,sizes:["S","M","L","XL"],colors:[{name:"Black",image:"https://images.unsplash.com/photo-1556821840-3a63f95609a7?w=900"},{name:"Grey",image:"https://images.unsplash.com/photo-1578681994506-b8f463449011?w=900"}]},

{id:2,name:"VYRO WINTER EDITION",price:109,description:"A winter essential. Premium materials, relaxed fit and exclusive details.",initial:20,stock:20,sizes:["S","M","L","XL"],colors:[{name:"Black",image:"https://images.unsplash.com/photo-1551028719-00167b16eac5?w=900"},{name:"Burgundy",image:"https://images.unsplash.com/photo-1578681994506-b8f463449011?w=900"}]},

{id:3,name:"VYRO STREET HOODIE",price:95,description:"A statement piece from the VYRO collection.",initial:15,stock:15,sizes:["M","L","XL"],colors:[{name:"Black",image:"https://images.unsplash.com/photo-1503341504253-dff4815485f1?w=900"}]}

]);

let orders=load("vyro_orders",[]);

let settings=load("vyro_settings",{currency:"TND",shipping:0,storeName:"VYRO"});

let selectedProduct=null,selectedColor=0,selectedSize="",quantity=1,cart=load("vyro_cart",[]);

function persist(){

save("vyro_products",products);

save("vyro_orders",orders);

save("vyro_cart",cart);

save("vyro_settings",settings);

}

function money(n){return Number(n).toFixed(2)+" "+settings.currency}

function imgFallback(el){el.onerror=null;el.src="https://placehold.co/600x750/101522/80bdff?text=VYRO"}

function goHome(){hideAll();$("home").classList.remove("hidden")}

function hideAll(){["home","shop","login","admin"].forEach(x=>$(x).classList.add("hidden"))}

function showShop(){hideAll();$("shop").classList.remove("hidden");showCatalog()}

function showCatalog(){

$("catalog").classList.remove("hidden");

["productView","checkoutView","cartView"].forEach(x=>$(x).classList.add("hidden"));

renderProducts();

}

function stockClass(p){

let r=p.initial? p.stock/p.initial:0;

return r<=.2?"low":r<=.5?"medium":"high";

}

function stockText(p){

let r=stockClass(p);

return r==="low"?"LOW STOCK":r==="medium"?"LIMITED STOCK":"IN STOCK";

}

function renderProducts(){

$("products").innerHTML=products.map(p=>{

let c=p.colors?.[0]?.image||"";

return `<article class="product-card" onclick="openProduct(${p.id})">

<img src="${c}" onerror="imgFallback(this)" alt="${esc(p.name)}">

<div class="product-info"><div class="product-name">${esc(p.name)}</div><div class="price">${money(p.price)}</div><div class="small" style="margin-top:8px">${p.stock>0?stockText(p):"SOLD OUT"}</div></div>

</article>`

}).join("")||'<div class="empty">THE COLLECTION IS COMING SOON.</div>';

}

function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}

function openProduct(id){

selectedProduct=products.find(p=>p.id===id);

if(!selectedProduct)return;

selectedColor=0;selectedSize=selectedProduct.sizes[0]||"";quantity=1;

$("catalog").classList.add("hidden");$("productView").classList.remove("hidden");

renderDetail();

}

function renderDetail(){

let p=selectedProduct,c=p.colors[selectedColor];

$("productView").innerHTML=`

<button class="back-btn" onclick="showCatalog()">← BACK TO COLLECTION</button>

<div class="product-detail">

<div><img class="detail-image" src="${c?.image||""}" onerror="imgFallback(this)"></div>

<div class="detail-info">

<div class="small blue">VYRO EXCLUSIVE COLLECTION</div>

<h1>${esc(p.name)}</h1><div class="price" style="font-size:23px">${money(p.price)}</div>

<p class="description">${esc(p.description)}</p>

<div class="field"><label>COLOR — ${esc(c?.name||"")}</label><div class="colors">${p.colors.map((v,i)=>`<button class="color-option ${i===selectedColor?"active":""}" onclick="chooseColor(${i})">${esc(v.name)}</button>`).join("")}</div></div>

<div class="field"><label>SIZE</label><div class="sizes">${p.sizes.map(s=>`<button class="size-option ${s===selectedSize?"active":""}" onclick="chooseSize('${esc(s)}')">${esc(s)}</button>`).join("")}</div></div>

<div class="field"><label>QUANTITY</label><div class="qty"><button onclick="changeQty(-1)">−</button><b id="qty">${quantity}</b><button onclick="changeQty(1)">＋</button></div></div>

<div class="stock ${stockClass(p)}">${p.stock} PIECES AVAILABLE · ${stockText(p)}</div>

<button class="primary-btn" ${p.stock<=0?"disabled":""} onclick="addToCart()">ADD TO CART — ${money(p.price*quantity)}</button>

<button class="secondary-btn" style="width:100%;margin-top:10px" onclick="checkoutDirect()">BUY NOW</button>

</div></div>`;

}

function chooseColor(i){selectedColor=i;renderDetail()}

function chooseSize(s){selectedSize=s;renderDetail()}

function changeQty(n){

quantity=Math.max(1,Math.min(selectedProduct.stock,quantity+n));

$("qty").textContent=quantity;

}

function addToCart(){

if(!selectedSize)return alert("Please select a size.");

let key=selectedProduct.id+"-"+selectedColor+"-"+selectedSize;

let existing=cart.find(x=>x.key===key);

if(existing)existing.quantity=Math.min(selectedProduct.stock,existing.quantity+quantity);

else cart.push({key,id:selectedProduct.id,colorIndex:selectedColor,size:selectedSize,quantity});

persist();alert("Added to your VYRO bag.");showCatalog();

}

function checkoutDirect(){

if(!selectedSize)return alert("Please select a size.");

cart=[{key:Date.now(),id:selectedProduct.id,colorIndex:selectedColor,size:selectedSize,quantity}];

persist();showCheckout();

}

function showCart(){

$("catalog").classList.add("hidden");$("productView").classList.add("hidden");$("checkoutView").classList.add("hidden");$("cartView").classList.remove("hidden");

renderCart();

}

function renderCart(){

let total=cart.reduce((sum,x)=>sum+(products.find(p=>p.id===x.id)?.price||0)*x.quantity,0);

$("cartView").innerHTML=`<button class="back-btn" onclick="showCatalog()">← CONTINUE SHOPPING</button><h1 class="section-title">YOUR BAG<span class="blue">.</span></h1>

${cart.length?cart.map((x,i)=>{let p=products.find(v=>v.id===x.id);if(!p)return"";return `<div class="admin-panel"><div class="row" style="display:flex;gap:15px;align-items:center"><img src="${p.colors[x.colorIndex]?.image||""}" onerror="imgFallback(this)" style="width:80px;height:90px;object-fit:cover;border-radius:10px"><div style="flex:1"><b>${esc(p.name)}</b><p class="small">${esc(p.colors[x.colorIndex]?.name)} · ${x.size} · Qty ${x.quantity}</p><p class="price">${money(p.price*x.quantity)}</p></div><button class="action" onclick="removeCart(${i})">REMOVE</button></div></div>`}).join(""):`<div class="empty">YOUR BAG IS EMPTY.</div>`}

${cart.length?`<div class="admin-panel"><h3>Total: ${money(total)}</h3><button class="primary-btn" onclick="showCheckout()">PROCEED TO CHECKOUT</button></div>`:""}`;

}

function removeCart(i){cart.splice(i,1);persist();renderCart()}

function showCheckout(){

$("catalog").classList.add("hidden");$("productView").classList.add("hidden");$("cartView").classList.add("hidden");$("checkoutView").classList.remove("hidden");

let total=cart.reduce((sum,x)=>sum+(products.find(p=>p.id===x.id)?.price||0)*x.quantity,0);

$("checkoutView").innerHTML=`<div class="checkout">

<button class="back-btn" onclick="showCart()">← BACK TO BAG</button>

<h1 class="section-title">CHECKOUT<span class="blue">.</span></h1><p class="subtitle">YOUR NEXT VYRO EXPERIENCE STARTS HERE</p>

<div class="checkout-summary" style="margin-top:25px"><h3 style="margin-bottom:15px">ORDER SUMMARY</h3>

${cart.map(x=>{let p=products.find(v=>v.id===x.id);return p?`<p style="margin:9px 0;font-size:12px">${esc(p.name)} · ${esc(p.colors[x.colorIndex]?.name)} · ${x.size} × ${x.quantity} — ${money(p.price*x.quantity)}</p>`:""}).join("")}

<hr><b>TOTAL: ${money(total)}</b></div>

<h2>DELIVERY INFORMATION</h2>

<div class="form-grid">

<div class="field"><label>FIRST NAME</label><input id="firstName" placeholder="Your first name" required></div>

<div class="field"><label>LAST NAME</label><input id="lastName" placeholder="Your last name" required></div>

</div>

<div class="field"><label>WILAYA</label><select id="wilaya"><option value="">Select your wilaya</option>${["Tunis","Ariana","Ben Arous","Manouba","Nabeul","Zaghouan","Bizerte","Béja","Jendouba","Kef","Siliana","Sousse","Monastir","Mahdia","Sfax","Kairouan","Kasserine","Sidi Bouzid","Gabès","Medenine","Tataouine","Gafsa","Tozeur","Kebili"].map(x=>`<option>${x}</option>`).join("")}</select></div>

<div class="field"><label>FULL ADDRESS</label><textarea id="address" rows="3" placeholder="Street, building, city..." required></textarea></div>

<div class="field"><label>PHONE NUMBER</label><input id="phone" type="tel" placeholder="+216 XX XXX XXX" required></div>

<div class="notice">Please double-check your information before confirming your order.</div>

<button class="primary-btn" onclick="placeOrder()">CONFIRM MY ORDER →</button>

</div>`;

}

function placeOrder(){

let first=$("firstName").value.trim(),last=$("lastName").value.trim(),wilaya=$("wilaya").value,address=$("address").value.trim(),phone=$("phone").value.trim();

if(!first||!last||!wilaya||!address||!phone)return alert("Please complete all delivery information.");

if(!/^[+0-9\s()-]{8,20}$/.test(phone))return alert("Please enter a valid phone number.");

if(!cart.length)return alert("Your bag is empty.");

for(let x of cart){let p=products.find(v=>v.id===x.id);if(!p||p.stock<x.quantity)return alert("Sorry, an item is no longer available in the requested quantity.")}

let total=cart.reduce((s,x)=>s+products.find(p=>p.id===x.id).price*x.quantity,0);

let order={id:"VY-"+Date.now().toString().slice(-8),date:new Date().toISOString(),first,last,wilaya,address,phone,total,status:"New",items:cart.map(x=>({...x,productName:products.find(p=>p.id===x.id).name,color:products.find(p=>p.id===x.id).colors[x.colorIndex]?.name,price:products.find(p=>p.id===x.id).price}))};

cart.forEach(x=>{let p=products.find(v=>v.id===x.id);p.stock-=x.quantity});

orders.unshift(order);cart=[];persist();

$("checkoutView").innerHTML=`<div class="glass checkout" style="padding:35px;text-align:center"><div style="font-size:55px;color:#4adf9b">✓</div><h1>ORDER CONFIRMED</h1><p class="subtitle">THANK YOU FOR CHOOSING VYRO</p><div class="admin-panel"><p class="small">YOUR ORDER NUMBER</p><h2 class="blue">${order.id}</h2><p style="margin-top:15px">Total: ${money(order.total)}</p></div><p class="small">Your order has been saved. Keep your order number for reference.</p><button class="primary-btn" onclick="showCatalog()">CONTINUE SHOPPING</button></div>`;

}

function showLogin(){hideAll();$("login").classList.remove("hidden");$("adminPassword").value=""}

function login(){

if($("adminPassword").value===ADMIN_PASSWORD){hideAll();$("admin").classList.remove("hidden");adminTab("dashboard")}

else $("loginError").classList.remove("hidden");

}

function adminTab(tab,btn){

["dashboard","orders","inventory","add","settings"].forEach(x=>$("admin-"+x).classList.add("hidden"));

$("admin-"+tab).classList.remove("hidden");

document.querySelectorAll(".side-btn").forEach(x=>x.classList.remove("active"));

if(btn)btn.classList.add("active");

else document.querySelectorAll(".side-btn")[0].classList.add("active");

if(tab==="dashboard")renderDashboard();

if(tab==="orders")renderOrders();

if(tab==="inventory")renderInventory();

if(tab==="add")renderAdd();

if(tab==="settings")renderSettings();

}

function renderDashboard(){

let revenue=orders.filter(o=>o.status!=="Cancelled").reduce((s,o)=>s+o.total,0);

$("admin-dashboard").innerHTML=`<h1 class="section-title">OVERVIEW<span class="blue">.</span></h1><p class="subtitle">YOUR VYRO COMMAND CENTER</p>

<div class="stats">

<div class="stat"><p>TOTAL ORDERS</p><h2>${orders.length}</h2></div>

<div class="stat"><p>REVENUE</p><h2>${money(revenue)}</h2></div>

<div class="stat"><p>PRODUCTS</p><h2>${products.length}</h2></div>

<div class="stat"><p>NEW ORDERS</p><h2>${orders.filter(o=>o.status==="New").length}</h2></div>

</div>

<div class="admin-panel"><h3>RECENT ORDERS</h3>${orders.length?`<div class="table-wrap"><table><tr><th>ORDER</th><th>CUSTOMER</th><th>TOTAL</th><th>STATUS</th></tr>${orders.slice(0,6).map(o=>`<tr><td>${o.id}</td><td>${esc(o.first)} ${esc(o.last)}</td><td>${money(o.total)}</td><td><span class="status">${esc(o.status)}</span></td></tr>`).join("")}</table></div>`:'<div class="empty">No orders yet.</div>'}</div>

<div class="admin-panel"><h3>LOW STOCK ALERTS</h3>${products.filter(p=>stockClass(p)==="low"||p.stock===0).map(p=>`<p style="padding:9px 0">${esc(p.name)} — <span class="blue">${p.stock} remaining</span></p>`).join("")||'<p class="small">All stock levels look good.</p>'}</div>`;

}

function renderOrders(){

$("admin-orders").innerHTML=`<h1 class="section-title">ORDERS<span class="blue">.</span></h1><p class="subtitle">CUSTOMER REQUESTS & DELIVERY</p>

<div class="admin-panel"><div class="table-wrap"><table><tr><th>ORDER ID</th><th>CUSTOMER</th><th>PHONE</th><th>TOTAL</th><th>STATUS</th><th>ACTION</th></tr>

${orders.map(o=>`<tr><td>${o.id}</td><td>${esc(o.first)} ${esc(o.last)}</td><td>${esc(o.phone)}</td><td>${money(o.total)}</td><td><span class="status ${o.status==="Completed"?"done":o.status==="Cancelled"?"cancel":""}">${esc(o.status)}</span></td><td><button class="action" onclick="orderDetails('${o.id}')">VIEW</button></td></tr>`).join("")||'<tr><td colspan="6">No orders yet.</td></tr>'}</table></div></div>`;

}

function orderDetails(id){

let o=orders.find(x=>x.id===id);if(!o)return;

$("orderModal").classList.remove("hidden");

$("modalContent").innerHTML=`<button class="close" onclick="closeModal()">✕</button><h2>ORDER DETAILS</h2><p class="blue" style="margin:12px 0">${o.id}</p>

<p style="line-height:2;font-size:13px"><b>Customer:</b> ${esc(o.first)} ${esc(o.last)}<br><b>Phone:</b> ${esc(o.phone)}<br><b>Wilaya:</b> ${esc(o.wilaya)}<br><b>Address:</b> ${esc(o.address)}<br><b>Date:</b> ${new Date(o.date).toLocaleString()}<br><b>Total:</b> ${money(o.total)}</p>

<hr><h3>ITEMS</h3>${o.items.map(x=>`<p class="small" style="margin:12px 0">${esc(x.productName)} · ${esc(x.color)} · ${esc(x.size)} × ${x.quantity} — ${money(x.price*x.quantity)}</p>`).join("")}

<div class="field"><label>UPDATE ORDER STATUS</label><select id="newStatus">${["New","Processing","Shipped","Completed","Cancelled"].map(s=>`<option ${o.status===s?"selected":""}>${s}</option>`).join("")}</select></div>

<button class="primary-btn" onclick="updateStatus('${o.id}')">SAVE STATUS</button>`;

}

function closeModal(){$("orderModal").classList.add("hidden")}

function updateStatus(id){let o=orders.find(x=>x.id===id);if(o){o.status=$("newStatus").value;persist();closeModal();renderOrders()}}

function renderInventory(){

$("admin-inventory").innerHTML=`<h1 class="section-title">INVENTORY<span class="blue">.</span></h1><p class="subtitle">MANAGE YOUR COLLECTION</p><div class="admin-panel"><button class="primary-btn" style="margin:0 0 20px" onclick="adminTab('add')">＋ ADD NEW PRODUCT</button>

<div class="table-wrap"><table><tr><th>PRODUCT</th><th>PRICE</th><th>INITIAL STOCK</th><th>CURRENT STOCK</th><th>ACTION</th></tr>${products.map(p=>`<tr><td>${esc(p.name)}</td><td>${money(p.price)}</td><td>${p.initial}</td><td class="${stockClass(p)}">${p.stock}</td><td><button class="action" onclick="editProduct(${p.id})">EDIT</button><button class="action" onclick="deleteProduct(${p.id})">DELETE</button></td></tr>`).join("")}</table></div></div>`;

}

function renderAdd(p=null){

let edit=!!p;

$("admin-add").innerHTML=`<h1 class="section-title">${edit?"EDIT":"NEW"} PRODUCT<span class="blue">.</span></h1><p class="subtitle">BUILD YOUR NEXT COLLECTION PIECE</p>

<div class="admin-panel">

<div class="field"><label>PRODUCT NAME</label><input id="pName" value="${esc(p?.name||"")}" placeholder="VYRO PREMIUM HOODIE"></div>

<div class="field"><label>PRICE (${settings.currency})</label><input id="pPrice" type="number" min="0" step=".01" value="${p?.price??""}"></div>

<div class="field"><label>DESCRIPTION</label><textarea id="pDesc" rows="4">${esc(p?.description||"")}</textarea></div>

<div class="form-grid">

<div class="field"><label>INITIAL STOCK</label><input id="pInitial" type="number" min="0" value="${p?.initial??""}"></div>

<div class="field"><label>CURRENT STOCK</label><input id="pStock" type="number" min="0" value="${p?.stock??""}"></div>

</div>

<div class="field"><label>SIZES (COMMA SEPARATED)</label><input id="pSizes" value="${esc(p?.sizes?.join(", ")||"S, M, L, XL")}"></div>

<hr><h3>PRODUCT COLORS & IMAGES</h3>

<div id="colorEntries">${(p?.colors||[{name:"Black",image:""}]).map((c,i)=>colorEntry(c,i)).join("")}</div>

<button class="secondary-btn" onclick="addColorEntry()">＋ ADD ANOTHER COLOR</button>

<button class="primary-btn" onclick="saveProduct(${p?.id||"null"})">${edit?"SAVE CHANGES":"PUBLISH PRODUCT"}</button>

</div>`;

}

function colorEntry(c={},i=0){

return `<div class="color-entry"><div class="field"><label>COLOR NAME</label><input class="color-name" value="${esc(c.name||"")}"></div><div class="field"><label>IMAGE URL</label><input class="color-image" value="${esc(c.image||"")}" placeholder="https://..."></div><div style="grid-column:1/-1"><span class="small">Use an image URL hosted online.</span><button class="action" onclick="this.closest('.color-entry').remove()">REMOVE COLOR</button></div></div>`;

}

function addColorEntry(){$("colorEntries").insertAdjacentHTML("beforeend",colorEntry({},0))}

function saveProduct(id){

let name=$("pName").value.trim(),price=Number($("pPrice").value),initial=Number($("pInitial").value),stock=Number($("pStock").value);

if(!name||!Number.isFinite(price)||price<0||!Number.isFinite(initial)||initial<0||!Number.isFinite(stock)||stock<0)return alert("Please enter valid product information.");

let colors=[...document.querySelectorAll(".color-entry")].map(e=>({name:e.querySelector(".color-name").value.trim(),image:e.querySelector(".color-image").value.trim()})).filter(c=>c.name&&c.image);

if(!colors.length)return alert("Add at least one color and image URL.");

let p={id:id?Number(id):Date.now(),name,price,description:$("pDesc").value,initial,stock,sizes:$("pSizes").value.split(",").map(s=>s.trim()).filter(Boolean),colors};

if(id){let index=products.findIndex(x=>x.id===Number(id));products[index]=p}

else products.unshift(p);

persist();alert("Product saved.");adminTab("inventory");

}

function editProduct(id){renderAdd(products.find(p=>p.id===id));adminTab("add")}

function deleteProduct(id){if(confirm("Delete this product?")){products=products.filter(p=>p.id!==id);persist();renderInventory()}}

function renderSettings(){

$("admin-settings").innerHTML=`<h1 class="section-title">SETTINGS<span class="blue">.</span></h1><p class="subtitle">STORE CONFIGURATION</p><div class="admin-panel">

<div class="field"><label>STORE NAME</label><input id="sName" value="${esc(settings.storeName)}"></div>

<div class="field"><label>CURRENCY</label><select id="sCurrency">${["TND","EUR","USD"].map(x=>`<option ${settings.currency===x?"selected":""}>${x}</option>`).join("")}</select></div>

<div class="field"><label>SHIPPING FEE</label><input id="sShipping" type="number" value="${settings.shipping}"></div>

<button class="primary-btn" onclick="saveSettings()">SAVE SETTINGS</button>

<hr><h3>DATA BACKUP</h3><button class="secondary-btn" onclick="exportData()">EXPORT STORE DATA</button>

<button class="secondary-btn" onclick="$('importFile').click()">IMPORT BACKUP</button><input type="file" id="importFile" class="hidden" accept=".json" onchange="importData(event)">

<p class="notice">Important: this standalone version stores information in the current browser only. It does not synchronize customer orders across different devices. A secure online database and authentication service are required for a live multi-device store.</p>

</div>`;

}

function saveSettings(){

settings={storeName:$("sName").value.trim()||"VYRO",currency:$("sCurrency").value,shipping:Number($("sShipping").value)||0};

persist();alert("Settings saved.");renderSettings();

}

function exportData(){

let data={products,orders,settings};

let blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});

let a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="VYRO-backup.json";a.click();URL.revokeObjectURL(a.href);

}

function importData(e){

let f=e.target.files[0];if(!f)return;

let reader=new FileReader();

reader.onload=()=>{

try{let d=JSON.parse(reader.result);if(!Array.isArray(d.products)||!Array.isArray(d.orders))throw Error();

products=d.products;orders=d.orders;settings=d.settings||settings;persist();alert("Backup imported.");renderSettings();

}catch{alert("Invalid backup file.")}};

reader.readAsText(f);

}

function adminTabShortcut(tab){adminTab(tab)}

renderProducts();

</script>

</body>

</html>
