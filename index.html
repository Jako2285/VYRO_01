

<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="theme-color" content="#030407">

<title>VYRO® — The New Dimension</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

:root{

--bg:#030407;

--surface:#090d15;

--surface2:#0e1420;

--surface3:#141e2e;

--blue:#258cff;

--blue2:#64b5ff;

--cyan:#9bd5ff;

--white:#f5f8ff;

--muted:#778397;

--line:rgba(135,174,231,.14);

--green:#36dba0;

--orange:#ffad50;

--red:#ff5969;

--radius:20px;

}

*{box-sizing:border-box;margin:0;padding:0}

html{scroll-behavior:smooth}

body{

background:var(--bg);color:var(--white);

font-family:'DM Sans',sans-serif;

min-height:100vh;overflow-x:hidden;

}

button,input,select,textarea{font:inherit}

button{cursor:pointer;color:inherit}

button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--blue)}

img{display:block;max-width:100%}

.hidden{display:none!important}

a{color:inherit;text-decoration:none}

::selection{background:#258cff;color:white}

::-webkit-scrollbar{width:6px}

::-webkit-scrollbar-track{background:#030407}

::-webkit-scrollbar-thumb{background:#19385b;border-radius:20px}

.noise{

position:fixed;inset:0;pointer-events:none;z-index:100;

opacity:.025;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.5'/%3E%3C/svg%3E");

}

.ambient{

position:fixed;inset:0;z-index:-2;pointer-events:none;

background:

radial-gradient(ellipse at 50% 0%,rgba(15,83,170,.16),transparent 45%),

radial-gradient(ellipse at 100% 70%,rgba(0,73,160,.08),transparent 40%),

#030407;

}

.ambient:after{

content:"";position:absolute;inset:0;

background-image:linear-gradient(rgba(100,160,240,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(100,160,240,.025) 1px,transparent 1px);

background-size:75px 75px;

mask-image:linear-gradient(to bottom,black,transparent 80%);

}

.lightning{

position:absolute;left:50%;top:0;transform:translateX(-50%);

width:min(900px,100%);height:100%;opacity:.5;

filter:drop-shadow(0 0 12px #168cff) drop-shadow(0 0 35px #006cff);

}

.lightning path{stroke-dasharray:1100;stroke-dashoffset:1100;animation:bolt 4s ease-in-out infinite}

@keyframes bolt{0%,15%{stroke-dashoffset:1100;opacity:0}30%{opacity:1}60%{stroke-dashoffset:0;opacity:.8}80%,100%{stroke-dashoffset:0;opacity:0}}

@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}

@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}

@keyframes appear{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}

@keyframes glow{0%,100%{box-shadow:0 0 20px #087cff18}50%{box-shadow:0 0 35px #087cff42}}

@keyframes scan{0%{transform:translateY(-100%)}100%{transform:translateY(300%)}}

.fade{animation:appear .6s ease both}

.container{width:min(1280px,91%);margin:auto}

.muted{color:var(--muted)}

.blue{color:var(--blue2)}

.eyebrow{

font-size:10px;letter-spacing:3.5px;color:var(--blue2);

font-weight:700;text-transform:uppercase;

}

.kicker{font-size:11px;letter-spacing:2px;color:#899ab3}

.section-heading{

font-family:Manrope,sans-serif;font-size:clamp(28px,4vw,49px);

font-weight:800;letter-spacing:-2px;line-height:1.12;

}

.section-sub{font-size:12px;color:var(--muted);margin-top:11px;letter-spacing:1.5px}

.btn{

border:1px solid var(--line);background:rgba(15,23,38,.72);

border-radius:13px;padding:13px 18px;

transition:.25s;display:inline-flex;align-items:center;

justify-content:center;gap:10px;font-size:11px;

font-weight:700;letter-spacing:1px;

}

.btn:hover{border-color:#3e9fff;transform:translateY(-2px);box-shadow:0 8px 30px #007bff1c}

.btn-primary{

background:linear-gradient(110deg,#0752ad,#178cff 55%,#50b5ff);

border:1px solid #64baff;color:white;

box-shadow:0 8px 35px #087cff30;

}

.btn-primary:hover{box-shadow:0 8px 45px #087cff55}

.btn-ghost{background:rgba(255,255,255,.035)}

.btn-danger{background:#38131d;border-color:#702a3a;color:#ff8794}

.btn-small{padding:9px 12px;font-size:10px}

.glass{

background:linear-gradient(145deg,rgba(22,34,53,.68),rgba(7,12,21,.78));

border:1px solid rgba(133,177,240,.15);

backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);

border-radius:var(--radius);

}

.logo{

font-family:Manrope,sans-serif;font-weight:800;

letter-spacing:.24em;font-size:29px;

}

.logo span{color:#66b7ff}

.icon{

width:42px;height:42px;border-radius:13px;

display:grid;place-items:center;

background:rgba(255,255,255,.035);

border:1px solid var(--line);

font-size:17px;transition:.25s;

}

.icon:hover{background:#102b4b;border-color:#258cff}

.icon svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

.topline{height:32px;background:#071426;border-bottom:1px solid #173353;display:flex;align-items:center;justify-content:center;font-size:9px;letter-spacing:3px;color:#9bcaff}

header{

position:sticky;top:0;z-index:30;

background:rgba(3,5,9,.84);backdrop-filter:blur(24px);

border-bottom:1px solid var(--line);

}

.nav{height:76px;display:flex;align-items:center;justify-content:space-between;gap:20px}

.nav-left,.nav-right{display:flex;align-items:center;gap:13px}

.nav-links{display:flex;gap:28px;margin-left:35px}

.nav-links a{font-size:10px;letter-spacing:1.5px;color:#a0aabd;transition:.2s}

.nav-links a:hover{color:white}

.nav-right{gap:9px}

.cart-count{

position:absolute;top:-5px;right:-5px;

width:17px;height:17px;background:#168bff;border-radius:50%;

font-size:9px;display:grid;place-items:center;color:white;

}

.hero{

min-height:calc(100vh - 108px);position:relative;

display:flex;align-items:center;justify-content:center;

text-align:center;overflow:hidden;padding:85px 15px 75px;

}

.hero-glow{

position:absolute;width:750px;height:750px;

background:radial-gradient(circle,rgba(0,100,255,.17),transparent 68%);

filter:blur(35px);pointer-events:none;

}

.hero-content{position:relative;z-index:2;max-width:800px}

.hero-mark{

font-family:Manrope,sans-serif;font-size:clamp(85px,19vw,190px);

font-weight:800;letter-spacing:.17em;padding-left:.17em;

line-height:1;text-shadow:0 0 45px #168bff22;

background:linear-gradient(180deg,#fff 15%,#d9e9ff 55%,#6caeff 100%);

background-clip:text;-webkit-background-clip:text;color:transparent;

}

.hero-rule{width:90px;height:1px;background:linear-gradient(90deg,transparent,#58aaff,transparent);margin:28px auto}

.hero h1{font-size:clamp(13px,2vw,17px);letter-spacing:6px;font-weight:500}

.hero p{font-size:12px;line-height:2;color:#8493a8;max-width:460px;margin:20px auto 35px}

.hero-actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}

.hero-actions .btn{min-width:195px;padding:18px 24px}

.hero-bottom{

position:absolute;bottom:35px;left:0;right:0;

display:flex;justify-content:space-between;padding:0 5%;

font-size:9px;letter-spacing:2px;color:#58677d;

}

.scroll-mark{display:flex;align-items:center;gap:10px}

.scroll-mark:before{content:"";height:25px;width:1px;background:#328eff}

.section{padding:90px 0}

.section-top{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:34px}

.feature-banner{

height:350px;position:relative;overflow:hidden;

border-radius:24px;border:1px solid var(--line);

background:#08111f;margin:0 auto 85px;

}

.feature-banner img{width:100%;height:100%;object-fit:cover;opacity:.55}

.feature-banner:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#030609 0%,#030609aa 45%,transparent 100%)}

.banner-content{position:absolute;z-index:2;top:50%;left:7%;transform:translateY(-50%);max-width:430px}

.banner-content h2{font-size:clamp(30px,5vw,55px);font-family:Manrope;font-weight:800;line-height:1.05;letter-spacing:-2px;margin:14px 0}

.banner-content p{font-size:12px;color:#a0afc5;line-height:1.8;margin-bottom:22px}

.products-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}

.product-card{

position:relative;overflow:hidden;border-radius:18px;

background:linear-gradient(145deg,#111a29,#070a10);

border:1px solid var(--line);transition:.35s;cursor:pointer;

}

.product-card:hover{transform:translateY(-7px);border-color:#348eff;box-shadow:0 20px 50px #007cff17}

.product-image{position:relative;aspect-ratio:4/5;overflow:hidden;background:#101522}

.product-image img{width:100%;height:100%;object-fit:cover;transition:transform .65s}

.product-card:hover .product-image img{transform:scale(1.055)}

.product-image:after{content:"";position:absolute;inset:40% 0 0;background:linear-gradient(transparent,#06080c88)}

.product-label{

position:absolute;top:15px;left:15px;z-index:2;

font-size:8px;letter-spacing:2px;padding:8px 11px;

background:#071426c9;border:1px solid #4b9eff50;border-radius:6px;

}

.product-quick{

position:absolute;bottom:14px;right:14px;z-index:3;

width:40px;height:40px;border-radius:50%;

background:#0a192a;border:1px solid #6bbaff66;

display:grid;place-items:center;font-size:18px;

}

.product-info{padding:18px}

.product-info h3{font-size:13px;letter-spacing:.3px}

.product-info-bottom{display:flex;justify-content:space-between;align-items:center;margin-top:12px}

.product-price{font-size:14px;color:#8ccaff;font-weight:700}

.stock-tag{font-size:9px;color:#7f91a8}

.collection-foot{display:flex;justify-content:center;margin-top:35px}

.collection-note{text-align:center;font-size:10px;letter-spacing:3px;color:#64748b;margin-top:30px}

.detail-layout{display:grid;grid-template-columns:1.05fr .95fr;gap:65px;align-items:start}

.detail-gallery{position:sticky;top:105px}

.detail-main-image{

width:100%;aspect-ratio:4/5;object-fit:cover;

border-radius:20px;border:1px solid var(--line);background:#111a28;

}

.detail-thumbs{display:flex;gap:10px;margin-top:13px;flex-wrap:wrap}

.detail-thumb{width:67px;height:80px;object-fit:cover;border-radius:9px;border:1px solid var(--line);cursor:pointer;opacity:.6}

.detail-thumb.active{opacity:1;border:1px solid var(--blue)}

.detail-info{padding:10px 0}

.detail-info h1{font-family:Manrope;font-size:clamp(30px,4vw,48px);letter-spacing:-2px;line-height:1.1;margin:15px 0}

.detail-price{font-size:23px;font-weight:700;color:#8bc8ff}

.detail-description{font-size:13px;line-height:2;color:#98a7bc;margin:24px 0}

.field{margin:21px 0}

.field label{display:block;font-size:9px;letter-spacing:2px;color:#9bacc4;margin-bottom:10px;font-weight:700}

.field input,.field select,.field textarea{

width:100%;padding:15px 16px;background:#080d16;

border:1px solid var(--line);border-radius:11px;

color:white;outline:none;transition:.2s;font-size:12px;

}

.field input:focus,.field select:focus,.field textarea:focus{border-color:#278fff;box-shadow:0 0 0 3px #168bff12}

.field select option{background:#0d1421}

.choices{display:flex;flex-wrap:wrap;gap:9px}

.choice{

min-width:45px;padding:12px 15px;background:#0c1320;

border:1px solid var(--line);border-radius:10px;

font-size:10px;font-weight:700;transition:.2s;

}

.choice.active{border-color:#3c9cff;background:#102b49;box-shadow:inset 0 0 14px #168bff18}

.color-choice{display:flex;align-items:center;gap:8px}

.swatch{width:14px;height:14px;border-radius:50%;border:1px solid #ffffff55}

.stock-line{font-size:10px;letter-spacing:1px;margin:20px 0}

.stock-low{color:var(--red)}.stock-medium{color:var(--orange)}.stock-high{color:var(--green)}

.qty-control{display:flex;align-items:center;gap:14px}

.qty-control button{width:36px;height:36px;border:1px solid var(--line);background:#101725;border-radius:9px}

.qty-control span{min-width:20px;text-align:center;font-size:13px}

.detail-buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.detail-buttons button{padding:16px 10px}

.checkout-layout{display:grid;grid-template-columns:1.2fr .8fr;gap:30px;align-items:start}

.checkout-panel,.summary-panel{padding:27px}

.checkout-panel h2,.summary-panel h2{font-family:Manrope;font-size:20px;margin-bottom:22px}

.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 15px}

.summary-item{display:flex;gap:13px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}

.summary-item img{width:57px;height:67px;object-fit:cover;border-radius:8px}

.summary-item-info{flex:1;min-width:0}

.summary-item-info strong{font-size:11px;display:block}

.summary-item-info small{font-size:9px;color:var(--muted)}

.summary-item b{font-size:11px;color:#91c9ff}

.total-row{display:flex;justify-content:space-between;padding:11px 0;font-size:12px;color:#a8b4c6}

.total-row.final{font-size:17px;color:white;font-weight:800;border-top:1px solid var(--line);margin-top:8px;padding-top:19px}

.bag-row{display:flex;gap:18px;padding:20px 0;border-bottom:1px solid var(--line)}

.bag-row img{width:100px;height:120px;object-fit:cover;border-radius:10px}

.bag-info{flex:1}

.bag-info h3{font-size:13px;margin-bottom:10px}

.bag-info p{font-size:10px;color:var(--muted);margin:5px 0}

.bag-info .price{color:#8bc8ff;font-weight:700;margin-top:12px}

.empty{padding:80px 20px;text-align:center;color:var(--muted)}

.empty .symbol{font-size:40px;color:#438fff;margin-bottom:20px}

.success-screen{text-align:center;padding:70px 20px;max-width:600px;margin:auto}

.success-icon{width:75px;height:75px;border:1px solid #36dba0;border-radius:50%;display:grid;place-items:center;color:#36dba0;font-size:35px;margin:0 auto 25px;box-shadow:0 0 35px #36dba025}

.order-code{padding:20px;border:1px solid #258cff44;background:#0b1a2b;border-radius:14px;margin:25px 0}

.order-code strong{font-size:25px;letter-spacing:3px;color:#8ccaff}

footer{border-top:1px solid var(--line);padding:55px 0 25px;margin-top:60px;background:linear-gradient(180deg,transparent,#07101d)}

.footer-grid{display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:35px}

.footer-brand p{font-size:11px;line-height:2;color:#738198;max-width:280px;margin-top:16px}

.footer-col h4{font-size:10px;letter-spacing:2px;margin-bottom:18px}

.footer-col p{font-size:11px;color:#8492a6;line-height:2.5}

.footer-bottom{display:flex;justify-content:space-between;gap:15px;border-top:1px solid var(--line);padding-top:22px;margin-top:45px;font-size:9px;letter-spacing:2px;color:#617087}

.admin-shell{min-height:100vh;background:radial-gradient(ellipse at 70% 0%,#0a1b31 0%,transparent 40%),#05070b}

.admin-header{height:75px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 4%;position:sticky;top:0;background:#05080deF;backdrop-filter:blur(20px);z-index:20}

.admin-layout{display:grid;grid-template-columns:235px minmax(0,1fr);min-height:calc(100vh - 75px)}

.admin-sidebar{border-right:1px solid var(--line);padding:27px 15px;display:flex;flex-direction:column;gap:7px}

.sidebar-label{font-size:9px;letter-spacing:2px;color:#52637c;padding:17px 12px 9px}

.side-link{display:flex;align-items:center;gap:12px;text-align:left;padding:14px 13px;background:transparent;border:1px solid transparent;border-radius:11px;font-size:11px;color:#95a4b8;transition:.2s}

.side-link .side-icon{font-size:16px;width:20px;text-align:center}

.side-link:hover,.side-link.active{background:linear-gradient(90deg,#102b4c,#0a1423);border-color:#23558a;color:white}

.admin-main{padding:35px 4%;min-width:0}

.admin-title-row{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}

.admin-title{font-family:Manrope;font-size:30px;font-weight:800;letter-spacing:-1px}

.admin-subtitle{font-size:10px;color:var(--muted);letter-spacing:1px;margin-top:7px}

.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin:30px 0}

.stat-card{padding:21px;border:1px solid var(--line);border-radius:15px;background:linear-gradient(145deg,#111a29,#080c13);position:relative;overflow:hidden}

.stat-card:after{content:"";position:absolute;width:110px;height:110px;background:#168bff12;filter:blur(25px);right:-35px;top:-35px}

.stat-top{display:flex;justify-content:space-between;align-items:center}

.stat-label{font-size:9px;color:#8393aa;letter-spacing:1.5px}

.stat-icon{color:#70baff;font-size:17px}

.stat-number{font-family:Manrope;font-size:28px;font-weight:800;margin-top:18px}

.stat-foot{font-size:9px;color:#64758c;margin-top:8px}

.admin-panel{padding:23px;border:1px solid var(--line);border-radius:16px;background:linear-gradient(145deg,#0d1420,#080c13);margin-bottom:20px}

.panel-head{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:22px}

.panel-head h3{font-family:Manrope;font-size:14px}

.table-wrap{overflow-x:auto}

table{width:100%;border-collapse:collapse;min-width:650px}

th{font-size:9px;color:#71839b;letter-spacing:1.5px;text-align:left;padding:13px 12px;border-bottom:1px solid var(--line)}

td{font-size:11px;color:#d5deec;padding:15px 12px;border-bottom:1px solid rgba(130,170,220,.08)}

tr:last-child td{border-bottom:0}

.status{display:inline-flex;align-items:center;gap:6px;padding:7px 10px;border-radius:20px;font-size:9px;background:#142d4a;color:#8bcaff;white-space:nowrap}

.status:before{content:"";width:5px;height:5px;background:currentColor;border-radius:50%}

.status.Completed{background:#0d3228;color:#50dfaa}

.status.Cancelled{background:#381923;color:#ff8290}

.status.Shipped{background:#2d2548;color:#c2a2ff}

.status.Processing{background:#3b2c17;color:#ffc16d}

.status.New{background:#142d4a;color:#8bcaff}

.admin-search{max-width:260px}

.admin-search input{background:#080d15;border:1px solid var(--line);padding:11px 13px;border-radius:9px;color:white;font-size:11px;width:100%}

.product-admin-img{width:43px;height:50px;object-fit:cover;border-radius:6px}

.admin-form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 17px}

.admin-form .field{margin:12px 0}

.admin-form .field input,.admin-form .field textarea,.admin-form .field select{background:#070c14}

.color-editor{padding:16px;background:#090f19;border:1px solid var(--line);border-radius:13px;margin:12px 0}

.color-editor-grid{display:grid;grid-template-columns:1fr 1.5fr auto;gap:10px;align-items:end}

.color-editor .field{margin:0}

.upload-label{display:block;padding:12px;background:#101e30;border:1px dashed #3985cc;border-radius:9px;font-size:10px;text-align:center;cursor:pointer;color:#9dceff}

.upload-label input{display:none}

.preview-image{width:55px;height:55px;object-fit:cover;border-radius:8px;margin-top:8px}

.admin-login{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(ellipse at 50% 40%,#0c2442,transparent 55%),#030407}

.login-card{width:min(420px,100%);padding:40px 35px;text-align:center}

.login-card .logo{font-size:39px;margin-bottom:10px}

.login-card h2{font-family:Manrope;font-size:23px;margin:28px 0 8px}

.login-card .field{text-align:left}

.login-lock{width:65px;height:65px;border-radius:20px;display:grid;place-items:center;background:#102c4a;border:1px solid #2c74b8;margin:25px auto;font-size:25px;color:#8ccaff}

.admin-login-note{font-size:9px;color:#65738a;line-height:1.8;margin-top:20px}

.modal-backdrop{position:fixed;inset:0;background:#000c;z-index:100;display:grid;place-items:center;padding:16px;backdrop-filter:blur(8px)}

.modal-card{width:min(650px,100%);max-height:90vh;overflow:auto;padding:27px;background:#0b111d;border:1px solid #29527d;border-radius:19px;box-shadow:0 25px 100px #000b}

.modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:23px}

.modal-header h2{font-family:Manrope;font-size:20px}

.toast{

position:fixed;bottom:25px;left:50%;transform:translate(-50%,20px);

z-index:200;background:#10253e;border:1px solid #3984ca;

border-radius:12px;padding:14px 22px;font-size:11px;

opacity:0;pointer-events:none;transition:.3s;box-shadow:0 10px 40px #0009;

}

.toast.show{opacity:1;transform:translate(-50%,0)}

.mobile-only{display:none}

@media(max-width:900px){

.nav-links{gap:15px;margin-left:10px}

.products-grid{grid-template-columns:repeat(2,1fr)}

.detail-layout{gap:30px}

.stats-grid{grid-template-columns:repeat(2,1fr)}

.admin-layout{grid-template-columns:190px minmax(0,1fr)}

}

@media(max-width:650px){

.topline{font-size:8px;letter-spacing:2px}

.nav{height:65px}

.nav-links{display:none}

.logo{font-size:23px}

.hero{min-height:calc(90vh - 90px)}

.hero-bottom{font-size:7px;letter-spacing:1px;bottom:20px}

.hero-mark{font-size:clamp(75px,20vw,120px)}

.hero h1{letter-spacing:3px;font-size:11px}

.hero p{font-size:11px}

.hero-actions{flex-direction:column;max-width:300px;margin:auto}

.hero-actions .btn{width:100%}

.section{padding:60px 0}

.section-top{align-items:start;flex-direction:column}

.feature-banner{height:300px}

.banner-content{left:7%;right:7%}

.products-grid{gap:11px}

.product-info{padding:12px}

.product-info h3{font-size:11px}

.product-price{font-size:12px}

.stock-tag{font-size:8px}

.detail-layout{grid-template-columns:1fr;gap:25px}

.detail-gallery{position:static}

.detail-main-image{aspect-ratio:4/4.5}

.checkout-layout{grid-template-columns:1fr}

.form-grid{grid-template-columns:1fr}

.footer-grid{grid-template-columns:1fr 1fr}

.footer-brand{grid-column:1/-1}

.footer-bottom{flex-direction:column}

.admin-header{padding:0 4%;height:65px}

.admin-layout{display:block}

.admin-sidebar{

position:sticky;top:65px;z-index:15;

border-right:0;border-bottom:1px solid var(--line);

padding:9px 8px;background:#080d15;

display:flex;flex-direction:row;overflow-x:auto;gap:5px;

}

.sidebar-label{display:none}

.side-link{white-space:nowrap;flex:0 0 auto;padding:11px 12px;font-size:9px}

.side-link .side-icon{font-size:13px;width:auto}

.admin-main{padding:25px 4%}

.stats-grid{gap:9px}

.stat-card{padding:15px}

.stat-number{font-size:22px}

.stat-label{font-size:8px}

.admin-title{font-size:25px}

.admin-form-grid{grid-template-columns:1fr}

.color-editor-grid{grid-template-columns:1fr 1fr}

.color-editor-grid>button{grid-column:1/-1}

.login-card{padding:30px 22px}

}

@media(max-width:380px){

.products-grid{grid-template-columns:1fr}

.product-image{aspect-ratio:4/4.5}

.footer-grid{grid-template-columns:1fr}

.footer-brand{grid-column:auto}

}

const esc=value=>String(value??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const uid=()=>Date.now()+Math.floor(Math.random()*10000);

let products=read(STORAGE.products,[

{

},

{

id:103,name:"VYRO STREET SERIES",

price:119,description:"A contemporary streetwear piece. Minimal expression, confident proportions and everyday comfort.",

initialStock:18,stock:18,

sizes:["S","M","L","XL"],

colors:[

{name:"Black",hex:"#101010",image:"https://images.unsplash.com/photo-1503341504253-dff4815485f1?w=1100"}

],

category:"STREETWEAR",featured:false

}

]);

let orders=read(STORAGE.orders,[]);

let settings=read(STORAGE.settings,{

currency:"TND",shipping:0,storeName:"VYRO",announcement:"THE NEW DIMENSION OF STREETWEAR"

});

let cart=read(STORAGE.cart,[]);

let state={

page:"home",product:null,color:0,size:"",quantity:1,

category:"ALL",search:"",adminTab:"dashboard",

editing:null,checkoutOrigin:"cart"

};

function persist(){

write(STORAGE.products,products);

write(STORAGE.orders,orders);

write(STORAGE.settings,settings);

write(STORAGE.cart,cart);

}

function money(n){

return Number(n||0).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2})+" "+settings.currency;

}

function stockLevel(p){

let ratio=p.initialStock>0?p.stock/p.initialStock:0;

if(p.stock<=0||ratio<=.2)return"low";

if(ratio<=.5)return"medium";

return"high";

}

function stockLabel(p){

let level=stockLevel(p);

return level==="low"?"LOW STOCK":level==="medium"?"LIMITED STOCK":"AVAILABLE";

}

function toast(message){

let t=$("toast");

t.textContent=message;t.classList.add("show");

clearTimeout(window.toastTimer);

window.toastTimer=setTimeout(()=>t.classList.remove("show"),2600);

}

function imageError(img){

img.onerror=null;

img.src="https://placehold.co/900x1100/0c1421/8ccaff?text=VYRO";

}

function icon(name){

const icons={

bag:'<svg viewBox="0 0 24 24"><path d="M5 8h14l1 13H4L5 8Z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>',

home:'<svg viewBox="0 0 24 24"><path d="m3 10 9-7 9 7"/><path d="M5 9v12h14V9"/><path d="M9 21v-7h6v7"/></svg>',

search:'<svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg>',

settings:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="m19.4 15 .1.1 1.4 1.1-1.4 2.4-1.7-.6a8 8 0 0 1-2 1.2l-.3 1.8h-2.8l-.3-1.8a8 8 0 0 1-2-1.2l-1.7.6-1.4-2.4 1.4-1.1a7 7 0 0 1 0-2.4l-1.4-1.1 1.4-2.4 1.7.6a8 8 0 0 1 2-1.2l.3-1.8h2.8l.3 1.8a8 8 0 0 1 2 1.2l1.7-.6 1.4 2.4-1.4 1.1a7 7 0 0 1 0 2.3Z"/></svg>',

};

return icons[name]||"";

}

<header><div class="container nav">

<a href="#" class="logo" onclick="go('home');return false">VYRO<span>®</span></a>

<nav class="nav-links">

<a href="#" onclick="go('home');return false">HOME</a>

<a href="#" onclick="go('shop');return false">COLLECTION</a>

<a href="#" onclick="go('shop');return false">NEW ARRIVALS</a>

</nav>

</div>

<div class="nav-right">

<button class="icon" aria-label="Search" onclick="go('shop');setTimeout(()=> $('shopSearch')?.focus(),100)">${icon("search")}</button>

<button class="icon" aria-label="Shopping bag" style="position:relative" onclick="go('cart')">${icon("bag")}<span class="cart-count" id="cartCount">${cart.reduce((s,x)=>s+x.quantity,0)}</span></button>

<button class="icon" aria-label="Home" onclick="go('home')">${icon("home")}</button>

</div>

</div></header>`;

}

function footer(){

return `<footer><div class="container">

<div class="footer-grid">

<div class="footer-brand"><div class="logo">VYRO<span>®</span></div><p>Beyond the ordinary. A new perspective on streetwear. Designed for those who define their own direction.</p></div>

<div class="footer-col"><h4>EXPLORE</h4><p onclick="go('shop')" style="cursor:pointer">Collection</p><p onclick="go('shop')" style="cursor:pointer">New arrivals</p><p onclick="go('home')" style="cursor:pointer">Our world</p></div>

</div>

<div class="footer-bottom"><span>© ${new Date().getFullYear()} VYRO® ALL RIGHTS RESERVED</span><span>BEYOND THE ORDINARY.</span></div>

</div></footer>`;

}

function homePage(){

return `${header()}

<main>

<section class="hero">

<div class="hero-glow"></div>

<svg class="lightning" viewBox="0 0 900 800" preserveAspectRatio="xMidYMid slice">

<path d="M560 -50 L445 210 L535 190 L340 530 L410 330 L310 350 L450 -50" stroke="#238cff" stroke-width="3" fill="none"/>

</div>

<img src="https://images.unsplash.com/photo-1523398002811-999ca8dec234?w=1800" alt="VYRO streetwear collection" onerror="imageError(this)">

<div class="banner-content">

<div class="eyebrow">DROP 02 · WINTER COLLECTION</div>

<h2>BUILT FOR<br>THE UNEXPECTED.</h2>

<p>Discover pieces that speak without saying a word. A new chapter in the VYRO universe.</p>

<button class="btn btn-primary" onclick="go('shop')">EXPLORE THE DROP ↗</button>

</div>

</div>

<div class="section-top">

<div><div class="eyebrow">CURATED FOR YOU</div><h2 class="section-heading" style="margin-top:12px">THE COLLECTION<span class="blue">.</span></h2><p class="section-sub">SELECTED PIECES. DISTINCTIVE IDENTITY.</p></div>

<button class="btn btn-ghost" onclick="go('shop')">VIEW ALL PRODUCTS ↗</button>

</div>

}

function productCards(list){

if(!list.length)return'<div class="empty" style="grid-column:1/-1">NO PRODUCTS AVAILABLE.</div>';

return list.map(p=>{

let c=p.colors?.[0];

return `<article class="product-card" onclick="openProduct(${p.id})">

<div class="product-image">

<img src="${esc(c?.image||"")}" alt="${esc(p.name)}" loading="lazy" onerror="imageError(this)">

<span class="product-label">${esc(p.category||"VYRO EXCLUSIVE")}</span>

<button class="product-quick" aria-label="View product" onclick="event.stopPropagation();openProduct(${p.id})">↗</button>

</div>

<div class="product-info">

</div></article>`;

}).join("");

}

function shopPage(){

let filtered=products.filter(p=>{

let matchCategory=state.category==="ALL"||p.category===state.category;

let matchSearch=p.name.toLowerCase().includes(state.search.toLowerCase());

return matchCategory&&matchSearch;

});

let categories=["ALL",...new Set(products.map(p=>p.category).filter(Boolean))];

return `${header()}<main class="container section fade">

<div class="section-top">

<div><div class="eyebrow">VYRO / THE ARCHIVE</div><h1 class="section-heading" style="margin-top:13px">THE COLLECTION<span class="blue">.</span></h1><p class="section-sub">EXPLORE THE LATEST VYRO PIECES.</p></div>

}

function updateProductGrid(){

let el=$("shopProductGrid");if(!el)return;

let filtered=products.filter(p=>(state.category==="ALL"||p.category===state.category)&&p.name.toLowerCase().includes(state.search.toLowerCase()));

el.innerHTML=productCards(filtered);

}

function openProduct(id){

let p=products.find(x=>x.id===id);if(!p)return;

state.product=id;state.color=0;state.size=p.sizes?.[0]||"";state.quantity=1;

go("product");

}

function productPage(){

let p=products.find(x=>x.id===state.product);

if(!p)return shopPage();

let color=p.colors[state.color]||p.colors[0];

return `${header()}<main class="container section fade">

function selectColor(i){state.color=i;render()}

function selectSize(s){state.size=s;render()}

function setQuantity(n){

let p=products.find(x=>x.id===state.product);

state.quantity=Math.max(1,Math.min(p.stock,state.quantity+n));

$("detailQty").textContent=state.quantity;

}

function addCart(){

let p=products.find(x=>x.id===state.product);

if(!state.size)return toast("Please select a size.");

if(p.stock<state.quantity)return toast("Not enough stock available.");

let existing=cart.find(x=>x.id===p.id&&x.color===state.color&&x.size===state.size);

if(existing)existing.quantity=Math.min(p.stock,existing.quantity+state.quantity);

else cart.push({id:p.id,color:state.color,size:state.size,quantity:state.quantity});

persist();updateCartCount();toast("Added to your VYRO bag.");

}

function buyNow(){

let p=products.find(x=>x.id===state.product);

if(!state.size)return toast("Please select a size.");

if(p.stock<state.quantity)return toast("Not enough stock available.");

cart=[{id:p.id,color:state.color,size:state.size,quantity:state.quantity}];

persist();state.checkoutOrigin="direct";go("checkout");

}

function updateCartCount(){

let el=$("cartCount");if(el)el.textContent=cart.reduce((s,x)=>s+x.quantity,0);

}

</div>

</div>`:`<div class="empty"><div class="symbol">◈</div><h2>YOUR BAG IS EMPTY</h2><p class="section-sub">DISCOVER YOUR NEXT VYRO PIECE.</p><button class="btn btn-primary" style="margin-top:25px" onclick="go('shop')">EXPLORE COLLECTION ↗</button></div>`}

</main>${footer()}`;

}

function removeCart(i){cart.splice(i,1);persist();render()}

function checkoutPage(){

if(!cart.length)return cartPage();

let total=cart.reduce((s,x)=>s+(products.find(p=>p.id===x.id)?.price||0)*x.quantity,0);

let grand=total+Number(settings.shipping||0);

return `${header()}<main class="container section fade">

<button class="btn btn-ghost" onclick="go('cart')">← BACK TO BAG</button>

<div style="margin:28px 0"><div class="eyebrow">FINAL STEP / DELIVERY</div><h1 class="section-heading" style="margin-top:12px">CHECKOUT<span class="blue">.</span></h1><p class="section-sub">COMPLETE YOUR ORDER INFORMATION.</p></div>

<div class="field"><label>WILAYA *</label><select name="wilaya" required><option value="">Choose your wilaya</option>${["Tunis","Ariana","Ben Arous","Manouba","Nabeul","Zaghouan","Bizerte","Béja","Jendouba","Le Kef","Siliana","Sousse","Monastir","Mahdia","Sfax","Kairouan","Kasserine","Sidi Bouzid","Gabès","Medenine","Tataouine","Gafsa","Tozeur","Kebili"].map(w=>`<option>${w}</option>`).join("")}</select></div>

function submitOrder(event){

event.preventDefault();

let form=new FormData(event.target);

let items=[];

for(let x of cart){

let p=products.find(p=>p.id===x.id);

if(!p||p.stock<x.quantity)return toast("An item is no longer available.");

items.push({

id:p.id,name:p.name,color:p.colors[x.color]?.name||"",

size:x.size,quantity:x.quantity,price:p.price,image:p.colors[x.color]?.image||""

});

}

let subtotal=items.reduce((s,x)=>s+x.price*x.quantity,0);

let order={

id:"VY-"+String(uid()).slice(-9),

date:new Date().toISOString(),

first:String(form.get("first")).trim(),

last:String(form.get("last")).trim(),

wilaya:String(form.get("wilaya")),

address:String(form.get("address")).trim(),

phone:String(form.get("phone")).trim(),

notes:String(form.get("notes")||"").trim(),

items,subtotal,shipping:Number(settings.shipping||0),

total:subtotal+Number(settings.shipping||0),

status:"New"

};

if(!/^[+0-9\s()-]{8,20}$/.test(order.phone))return toast("Please enter a valid phone number.");

for(let x of items){let p=products.find(p=>p.id===x.id);p.stock-=x.quantity;}

orders.unshift(order);cart=[];persist();updateCartCount();

state.page="success";render();

}

</div>

function previewVariant(input){

let card=input.closest(".color-editor"),img=card.querySelector(".preview-image");

img.src=input.value;img.classList.remove("hidden");

}

function uploadVariant(input){

let file=input.files?.[0];if(!file)return;

if(!file.type.startsWith("image/"))return toast("Please select an image file.");

if(file.size>1.5*1024*1024)return toast("Image too large. Use an image under 1.5 MB.");

let reader=new FileReader();

reader.onload=()=>{

let card=input.closest(".color-editor");

card.querySelector(".variant-url").value=reader.result;

let img=card.querySelector(".preview-image");

img.src=reader.result;img.classList.remove("hidden");

};

reader.readAsDataURL(file);

}

function saveProduct(e){

e.preventDefault();

let name=$("pName").value.trim();

let price=Number($("pPrice").value);

let initialStock=Number($("pInitial").value);

let stock=Number($("pStock").value);

if(!name||price<0||initialStock<0||stock<0)return toast("Check your product details.");

let colors=[...document.querySelectorAll(".color-editor")].map(el=>({

name:el.querySelector(".variant-name").value.trim(),

hex:el.querySelector(".variant-hex").value.trim()||"#111111",

image:el.querySelector(".variant-url").value.trim()

}));

if(!colors.length||colors.some(c=>!c.name||!c.image))return toast("Each color needs a name and image.");

let sizes=$("pSizes").value.split(",").map(x=>x.trim()).filter(Boolean);

if(!sizes.length)return toast("Add at least one size.");

let data={

id:state.editing||uid(),name,price,

description:$("pDescription").value.trim(),

category:$("pCategory").value,

featured:$("pFeatured").value==="true",

initialStock,stock,sizes,colors

};

if(state.editing){

let i=products.findIndex(x=>x.id===state.editing);

if(i>=0)products[i]=data;

}else products.unshift(data);

state.editing=null;persist();adminTab("products");toast("Product saved successfully.");

}

<p class="kicker" style="line-height:2.1">THIS GITHUB PAGES VERSION USES LOCAL BROWSER STORAGE. PRODUCTS, ORDERS AND STOCK ARE STORED IN THE CURRENT BROWSER ONLY. ORDERS PLACED BY CUSTOMERS ON OTHER DEVICES WILL NOT AUTOMATICALLY APPEAR HERE. FOR A REAL PUBLIC STORE, CONNECT A SECURE DATABASE AND SERVER-SIDE ADMIN AUTHENTICATION. THE FRONT-END ADMIN PASSWORD IS NOT A SECURITY BOUNDARY.</p>

}

function saveSettings(){

settings={

storeName:$("settingName").value.trim()||"VYRO",

currency:$("settingCurrency").value,

shipping:Math.max(0,Number($("settingShipping").value)||0),

announcement:$("settingAnnouncement").value.trim()

};

persist();toast("Settings saved.");render();

}

function exportBackup(){

let data={version:1,products,orders,settings};

let blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});

let url=URL.createObjectURL(blob),a=document.createElement("a");

a.href=url;a.download="VYRO-STORE-BACKUP.json";a.click();URL.revokeObjectURL(url);

}

function importBackup(e){

let file=e.target.files?.[0];if(!file)return;

let reader=new FileReader();

reader.onload=()=>{

try{

let data=JSON.parse(reader.result);

if(!Array.isArray(data.products)||!Array.isArray(data.orders))throw Error("Invalid");

products=data.products;orders=data.orders;settings=data.settings||settings;persist();render();toast("Backup imported successfully.");

}catch{toast("Invalid backup file.");}

};

reader.readAsText(file);

}

function modal(content){

let existing=$("modalBackdrop");if(existing)existing.remove();

let el=document.createElement("div");

el.id="modalBackdrop";el.className="modal-backdrop";

el.innerHTML=`<div class="modal-card">${content}</div>`;

el.addEventListener("click",e=>{if(e.target===el)closeModal()});

document.body.appendChild(el);

}

function closeModal(){$("modalBackdrop")?.remove()}

function go(page){

state.page=page;

render();

window.scrollTo({top:0,behavior:"instant"});

}

function render(){

let app=$("app");

switch(state.page){

case"shop":app.innerHTML=shopPage();break;

case"product":app.innerHTML=productPage();break;

case"cart":app.innerHTML=cartPage();break;

case"checkout":app.innerHTML=checkoutPage();break;

case"success":app.innerHTML=successPage();break;

case"adminLogin":app.innerHTML=adminLoginPage();break;

case"admin":app.innerHTML=adminPage();break;

default:app.innerHTML=homePage();

}

updateCartCount();

}

window.addEventListener("storage",e=>{

if(Object.values(STORAGE).includes(e.key)){

products=read(STORAGE.products,products);

orders=read(STORAGE.orders,orders);

settings=read(STORAGE.settings,settings);

cart=read(STORAGE.cart,cart);

render();

}

});

render();

</script>
