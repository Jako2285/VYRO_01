<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#000000">
<title>VYRO® — Beyond The Ordinary</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
--black:#000;
--bg:#020203;
--panel:#050608;
--panel2:#080a0e;
--blue:#087bff;
--blue2:#168cff;
--electric:#43a6ff;
--white:#f8f9fc;
--muted:#777e8c;
--line:rgba(255,255,255,.075);
--glow:rgba(0,115,255,.2);
--green:#35d69b;
--orange:#ffae53;
--red:#ff5268;
--radius:20px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
background:var(--black);
color:var(--white);
font-family:'DM Sans',sans-serif;
min-height:100vh;
overflow-x:hidden;
}
button,input,select,textarea{font:inherit}
button{cursor:pointer;color:inherit}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
.hidden{display:none!important}
::selection{background:#087bff;color:white}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:#000}
::-webkit-scrollbar-thumb{background:#123b69;border-radius:20px}

body:before{
content:"";
position:fixed;
inset:0;
z-index:-3;
pointer-events:none;
background:
radial-gradient(ellipse at 50% 0%,rgba(0,75,190,.10),transparent 45%),
radial-gradient(ellipse at 100% 75%,rgba(0,50,130,.055),transparent 40%),
#000;
}
body:after{
content:"";
position:fixed;
inset:0;
z-index:-2;
pointer-events:none;
opacity:.12;
background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.18'/%3E%3C/svg%3E");
}
.container{width:min(1280px,91%);margin:auto}
.muted{color:var(--muted)}
.blue{color:var(--electric)}
.eyebrow{
font-size:9px;
font-weight:700;
letter-spacing:4px;
color:#65adff;
text-transform:uppercase;
}
.kicker{font-size:10px;letter-spacing:2px;color:#747d8d}
.section{padding:95px 0}
.section-heading{
font-family:Manrope,sans-serif;
font-size:clamp(32px,5vw,58px);
font-weight:800;
letter-spacing:-2.5px;
line-height:1.05;
}
.section-sub{font-size:11px;color:#737d8e;margin-top:13px;letter-spacing:2px}
.section-top{
display:flex;
justify-content:space-between;
align-items:end;
gap:20px;
margin-bottom:35px;
}
.logo{
font-family:Manrope,sans-serif;
font-weight:800;
font-size:27px;
letter-spacing:.25em;
}
.logo span{color:#258eff}
.btn{
position:relative;
overflow:hidden;
border:1px solid rgba(255,255,255,.10);
background:#08090c;
border-radius:12px;
padding:14px 19px;
display:inline-flex;
align-items:center;
justify-content:center;
gap:10px;
font-size:10px;
font-weight:700;
letter-spacing:1.5px;
transition:.3s;
}
.btn:before{
content:"";
position:absolute;
left:0;top:0;bottom:0;
width:2px;
background:linear-gradient(transparent,#168cff,transparent);
opacity:0;
transition:.3s;
}
.btn:hover{
border-color:#147de7;
transform:translateY(-2px);
box-shadow:0 8px 35px rgba(0,100,255,.13);
}
.btn:hover:before{opacity:1}
.btn-primary{
background:linear-gradient(110deg,#03428e,#087bff 60%,#168cff);
border:1px solid #168cff;
box-shadow:0 8px 30px rgba(0,100,255,.16);
}
.btn-primary:hover{box-shadow:0 8px 45px rgba(0,115,255,.3)}
.btn-ghost{background:#050608}
.btn-danger{color:#ff7180;border-color:#63212d;background:#16070a}
.btn-small{padding:9px 12px;font-size:9px}
.glass{
background:linear-gradient(145deg,rgba(12,14,19,.94),rgba(3,4,6,.98));
border:1px solid rgba(255,255,255,.075);
backdrop-filter:blur(22px);
border-radius:var(--radius);
}
.icon-btn{
width:43px;height:43px;
display:grid;place-items:center;
border:1px solid var(--line);
border-radius:13px;
background:#050608;
font-size:17px;
transition:.25s;
}
.icon-btn:hover{border-color:#168cff;color:#75baff;background:#050d18}
.topline{
height:30px;
display:flex;
align-items:center;
justify-content:center;
background:#000;
border-bottom:1px solid rgba(15,105,220,.25);
font-size:9px;
letter-spacing:3px;
color:#8ebfff;
}
header{
position:sticky;
top:0;
z-index:30;
background:rgba(0,0,0,.91);
backdrop-filter:blur(22px);
border-bottom:1px solid rgba(255,255,255,.07);
}
.nav{
height:76px;
display:flex;
align-items:center;
justify-content:space-between;
gap:20px;
}
.nav-left,.nav-right{display:flex;align-items:center;gap:14px}
.nav-links{display:flex;gap:30px;margin-left:35px}
.nav-links a{
font-size:9px;
letter-spacing:1.8px;
color:#999eaa;
transition:.2s;
}
.nav-links a:hover{color:white}
.nav-right{gap:9px}
.cart-count{
position:absolute;
top:-5px;right:-5px;
width:17px;height:17px;
display:grid;place-items:center;
border-radius:50%;
background:#087bff;
font-size:9px;
}
.hero{
min-height:calc(100vh - 106px);
position:relative;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
overflow:hidden;
padding:90px 15px 100px;
}
.hero:before{
content:"";
position:absolute;
width:700px;height:700px;
background:radial-gradient(circle,rgba(0,90,255,.12),transparent 68%);
filter:blur(30px);
}
.hero-lightning{
position:absolute;
inset:0;
width:100%;
height:100%;
pointer-events:none;
opacity:.65;
filter:drop-shadow(0 0 9px #087bff) drop-shadow(0 0 28px #0055dd);
}
.hero-lightning path{
stroke-dasharray:1000;
stroke-dashoffset:1000;
animation:lightning 7s ease-in-out infinite;
}
@keyframes lightning{
0%,12%{stroke-dashoffset:1000;opacity:0}
20%{opacity:.9}
48%{stroke-dashoffset:0;opacity:.7}
65%,100%{stroke-dashoffset:0;opacity:0}
}
.hero-content{position:relative;z-index:2;max-width:850px}
.hero-mark{
font-family:Manrope,sans-serif;
font-size:clamp(95px,20vw,210px);
font-weight:800;
letter-spacing:.17em;
padding-left:.17em;
line-height:1;
background:linear-gradient(180deg,#fff 15%,#dceaff 55%,#559cff 100%);
background-clip:text;
-webkit-background-clip:text;
color:transparent;
filter:drop-shadow(0 0 35px rgba(0,115,255,.12));
}
.hero-rule{
width:90px;height:1px;
background:linear-gradient(90deg,transparent,#168cff,transparent);
margin:30px auto;
}
.hero h1{font-size:14px;letter-spacing:7px;font-weight:500}
.hero p{
font-size:12px;
line-height:2.1;
color:#858b98;
max-width:450px;
margin:22px auto 36px;
}
.hero-actions{display:flex;justify-content:center;gap:13px;flex-wrap:wrap}
.hero-actions .btn{min-width:205px;padding:18px 23px}
.hero-bottom{
position:absolute;
bottom:30px;left:0;right:0;
display:flex;
justify-content:space-between;
padding:0 5%;
font-size:9px;
letter-spacing:2px;
color:#626b7b;
}
.scroll-mark{display:flex;align-items:center;gap:10px}
.scroll-mark:before{content:"";height:24px;width:1px;background:#168cff}
.feature-banner{
height:370px;
position:relative;
overflow:hidden;
border-radius:22px;
border:1px solid rgba(255,255,255,.08);
background:#020203;
margin-bottom:95px;
}
.feature-banner img{width:100%;height:100%;object-fit:cover;opacity:.28}
.feature-banner:after{
content:"";
position:absolute;inset:0;
background:linear-gradient(90deg,#000 0%,rgba(0,0,0,.85) 42%,transparent 100%);
}
.banner-content{
position:absolute;
z-index:2;
top:50%;left:7%;
transform:translateY(-50%);
max-width:430px;
}
.banner-content h2{
font-family:Manrope;
font-size:clamp(32px,5vw,58px);
line-height:1.02;
letter-spacing:-2px;
margin:15px 0;
}
.banner-content p{font-size:12px;color:#9ba2ae;line-height:1.9;margin-bottom:24px}
.products-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.product-card{
position:relative;
overflow:hidden;
border-radius:16px;
background:#050608;
border:1px solid rgba(255,255,255,.075);
transition:.35s;
cursor:pointer;
}
.product-card:hover{
transform:translateY(-6px);
border-color:#126bca;
box-shadow:0 18px 50px rgba(0,95,255,.12);
}
.product-image{
position:relative;
aspect-ratio:4/5;
overflow:hidden;
background:#050608;
}
.product-image img{width:100%;height:100%;object-fit:cover;transition:.65s}
.product-card:hover .product-image img{transform:scale(1.045)}
.product-label{
position:absolute;
top:15px;left:15px;
z-index:2;
font-size:8px;
letter-spacing:2px;
padding:8px 11px;
background:rgba(0,0,0,.8);
border:1px solid rgba(30,135,255,.4);
border-radius:5px;
}
.product-quick{
position:absolute;
bottom:14px;right:14px;
z-index:3;
width:40px;height:40px;
border-radius:50%;
background:#02060c;
border:1px solid #168cff;
display:grid;place-items:center;
}
.product-info{padding:19px}
.product-info h3{font-size:12px;letter-spacing:.5px}
.product-info-bottom{
display:flex;
justify-content:space-between;
align-items:center;
margin-top:13px;
}
.product-price{font-size:14px;color:#8cc5ff;font-weight:700}
.stock-tag{font-size:9px;color:#7d899a}
.empty{
padding:75px 20px;
text-align:center;
color:#747d8b;
border:1px dashed rgba(255,255,255,.10);
border-radius:18px;
background:rgba(255,255,255,.008);
}
.empty-symbol{
font-size:35px;
color:#168cff;
margin-bottom:20px;
}
.empty h2{font-family:Manrope;font-size:20px;color:#f3f5f9;letter-spacing:2px}
.empty p{font-size:11px;line-height:2;margin-top:12px}
.detail-layout{display:grid;grid-template-columns:1.05fr .95fr;gap:65px;align-items:start}
.detail-gallery{position:sticky;top:105px}
.detail-main-image{
width:100%;
aspect-ratio:4/5;
object-fit:cover;
border-radius:18px;
border:1px solid var(--line);
background:#050608;
}
.detail-thumbs{display:flex;gap:10px;margin-top:13px;flex-wrap:wrap}
.detail-thumb{
width:65px;height:78px;
object-fit:cover;
border-radius:8px;
border:1px solid var(--line);
cursor:pointer;opacity:.6;
}
.detail-thumb.active{opacity:1;border-color:#168cff}
.detail-info h1{
font-family:Manrope;
font-size:clamp(30px,4vw,48px);
letter-spacing:-2px;
line-height:1.1;
margin:15px 0;
}
.detail-price{font-size:23px;font-weight:700;color:#8bc8ff}
.detail-description{font-size:13px;line-height:2;color:#9ba2ae;margin:24px 0}
.field{margin:20px 0}
.field label{
display:block;
font-size:9px;
letter-spacing:2px;
color:#a0a8b5;
margin-bottom:10px;
font-weight:700;
}
.field input,.field select,.field textarea{
width:100%;
padding:15px 16px;
background:#030405;
border:1px solid rgba(255,255,255,.10);
border-radius:10px;
color:white;
outline:none;
font-size:12px;
transition:.2s;
}
.field input:focus,.field select:focus,.field textarea:focus{
border-color:#168cff;
box-shadow:0 0 0 3px rgba(0,115,255,.08);
}
.field select option{background:#050608}
.choices{display:flex;flex-wrap:wrap;gap:9px}
.choice{
min-width:45px;
padding:12px 15px;
background:#050608;
border:1px solid rgba(255,255,255,.1);
border-radius:9px;
font-size:10px;
font-weight:700;
transition:.2s;
}
.choice.active{border-color:#168cff;background:#07172a;box-shadow:inset 0 0 14px rgba(0,115,255,.1)}
.color-choice{display:flex;align-items:center;gap:8px}
.swatch{width:14px;height:14px;border-radius:50%;border:1px solid #ffffff55}
.stock-line{font-size:10px;letter-spacing:1px;margin:20px 0}
.stock-low{color:var(--red)}
.stock-medium{color:var(--orange)}
.stock-high{color:var(--green)}
.qty-control{display:flex;align-items:center;gap:14px}
.qty-control button{
width:36px;height:36px;
border:1px solid var(--line);
background:#050608;
border-radius:9px;
}
.qty-control span{min-width:20px;text-align:center;font-size:13px}
.detail-buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.detail-buttons button{padding:16px 10px}
.checkout-layout{display:grid;grid-template-columns:1.2fr .8fr;gap:25px;align-items:start}
.checkout-panel,.summary-panel{padding:27px}
.checkout-panel h2,.summary-panel h2{font-family:Manrope;font-size:19px;margin-bottom:22px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 15px}
.summary-item{display:flex;gap:13px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.summary-item img{width:57px;height:67px;object-fit:cover;border-radius:8px}
.summary-item-info{flex:1;min-width:0}
.summary-item-info strong{font-size:11px;display:block}
.summary-item-info small{font-size:9px;color:var(--muted)}
.summary-item b{font-size:11px;color:#91c9ff}
.total-row{
display:flex;justify-content:space-between;
padding:11px 0;font-size:12px;color:#a8b4c6;
}
.total-row.final{
font-size:17px;color:white;font-weight:800;
border-top:1px solid var(--line);
margin-top:8px;padding-top:19px;
}
.bag-row{display:flex;gap:18px;padding:20px 0;border-bottom:1px solid var(--line)}
.bag-row img{width:100px;height:120px;object-fit:cover;border-radius:10px}
.bag-info{flex:1}
.bag-info h3{font-size:13px;margin-bottom:10px}
.bag-info p{font-size:10px;color:var(--muted);margin:5px 0}
.bag-info .price{color:#8bc8ff;font-weight:700;margin-top:12px}
.success-screen{text-align:center;padding:70px 20px;max-width:600px;margin:auto}
.success-icon{
width:75px;height:75px;
border:1px solid #35d69b;border-radius:50%;
display:grid;place-items:center;
color:#35d69b;font-size:35px;
margin:0 auto 25px;
box-shadow:0 0 35px #36dba025;
}
.order-code{
padding:20px;
border:1px solid #168cff55;
background:#030a14;
border-radius:14px;
margin:25px 0;
}
.order-code strong{font-size:25px;letter-spacing:3px;color:#8ccaff}
footer{
border-top:1px solid var(--line);
padding:55px 0 25px;
margin-top:60px;
background:#010102;
}
.footer-grid{display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:35px}
.footer-brand p{font-size:11px;line-height:2;color:#737d8c;max-width:280px;margin-top:16px}
.footer-col h4{font-size:10px;letter-spacing:2px;margin-bottom:18px}
.footer-col p{font-size:11px;color:#8492a6;line-height:2.5}
.footer-bottom{
display:flex;justify-content:space-between;gap:15px;
border-top:1px solid var(--line);
padding-top:22px;margin-top:45px;
font-size:9px;letter-spacing:2px;color:#626b7b;
}

/* ADMIN */
.admin-shell{min-height:100vh;background:#000}
.admin-header{
height:76px;
border-bottom:1px solid rgba(255,255,255,.08);
display:flex;align-items:center;justify-content:space-between;
padding:0 4%;
position:sticky;top:0;
background:rgba(0,0,0,.95);
backdrop-filter:blur(20px);
z-index:20;
}
.admin-layout{
display:grid;
grid-template-columns:245px minmax(0,1fr);
min-height:calc(100vh - 76px);
}
.admin-sidebar{
border-right:1px solid rgba(255,255,255,.07);
padding:28px 15px;
display:flex;flex-direction:column;gap:7px;
background:#020203;
}
.sidebar-label{
font-size:9px;letter-spacing:2px;color:#505b6c;
padding:18px 12px 9px;
}
.side-link{
display:flex;align-items:center;gap:12px;
text-align:left;padding:14px 13px;
background:transparent;
border:1px solid transparent;
border-radius:10px;
font-size:10px;letter-spacing:.8px;
color:#929baa;transition:.2s;
}
.side-link .side-icon{font-size:16px;width:20px;text-align:center}
.side-link:hover,.side-link.active{
background:linear-gradient(90deg,#06172a,#03070c);
border-color:rgba(22,140,255,.35);
color:white;
}
.admin-main{padding:38px 4%;min-width:0}
.admin-title-row{
display:flex;align-items:center;justify-content:space-between;
gap:20px;flex-wrap:wrap;
}
.admin-title{font-family:Manrope;font-size:32px;font-weight:800;letter-spacing:-1px}
.admin-subtitle{font-size:10px;color:#737d8c;letter-spacing:1px;margin-top:7px}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin:30px 0}
.stat-card{
padding:22px;
border:1px solid rgba(255,255,255,.08);
border-radius:15px;
background:linear-gradient(145deg,#080a0e,#020203);
position:relative;overflow:hidden;
}
.stat-card:after{
content:"";position:absolute;
width:110px;height:110px;
background:rgba(0,100,255,.10);
filter:blur(25px);
right:-35px;top:-35px;
}
.stat-top{display:flex;justify-content:space-between;align-items:center}
.stat-label{font-size:9px;color:#8993a2;letter-spacing:1.5px}
.stat-icon{color:#70baff;font-size:17px}
.stat-number{font-family:Manrope;font-size:27px;font-weight:800;margin-top:18px}
.stat-foot{font-size:9px;color:#687487;margin-top:8px}
.admin-panel{
padding:24px;
border:1px solid rgba(255,255,255,.08);
border-radius:16px;
background:linear-gradient(145deg,#080a0e,#020203);
margin-bottom:20px;
}
.panel-head{
display:flex;align-items:center;justify-content:space-between;
gap:15px;margin-bottom:22px;
}
.panel-head h3{font-family:Manrope;font-size:14px}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:650px}
th{
font-size:9px;color:#718096;letter-spacing:1.5px;
text-align:left;padding:13px 12px;
border-bottom:1px solid var(--line);
}
td{
font-size:11px;color:#d5deec;
padding:15px 12px;
border-bottom:1px solid rgba(255,255,255,.05);
}
tr:last-child td{border-bottom:0}
.status{
display:inline-flex;align-items:center;gap:6px;
padding:7px 10px;border-radius:20px;
font-size:9px;background:#10243a;color:#8bcaff;white-space:nowrap;
}
.status:before{content:"";width:5px;height:5px;background:currentColor;border-radius:50%}
.status.Completed{background:#0d3228;color:#50dfaa}
.status.Cancelled{background:#381923;color:#ff8290}
.status.Shipped{background:#2d2548;color:#c2a2ff}
.status.Processing{background:#3b2c17;color:#ffc16d}
.admin-search{max-width:260px}
.admin-search input{
background:#030405;
border:1px solid var(--line);
padding:11px 13px;border-radius:9px;
color:white;font-size:11px;width:100%;
}
.product-admin-img{width:43px;height:50px;object-fit:cover;border-radius:6px}
.admin-form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 17px}
.admin-form .field{margin:12px 0}
.color-editor{
padding:17px;
background:#030405;
border:1px solid rgba(255,255,255,.08);
border-radius:13px;margin:12px 0;
}
.color-editor-grid{
display:grid;
grid-template-columns:1fr 1fr auto;
gap:10px;align-items:end;
}
.color-editor .field{margin:0}
.upload-label{
display:block;padding:13px;
background:#050d17;
border:1px dashed #1764aa;
border-radius:9px;
font-size:10px;text-align:center;
cursor:pointer;color:#9dceff;
}
.upload-label input{display:none}
.preview-image{
width:65px;height:65px;
object-fit:cover;border-radius:8px;margin-top:10px;
}
.admin-login{
min-height:100vh;
display:grid;place-items:center;
padding:20px;
background:radial-gradient(ellipse at 50% 45%,rgba(0,75,180,.12),transparent 55%),#000;
}
.login-card{width:min(420px,100%);padding:40px 35px;text-align:center}
.login-card .logo{font-size:39px;margin-bottom:10px}
.login-card h2{font-family:Manrope;font-size:24px;margin:28px 0 8px}
.login-card .field{text-align:left}
.login-lock{
width:65px;height:65px;border-radius:20px;
display:grid;place-items:center;

<body>
<div id="app"></div>
<div id="toast" class="toast"></div>

<script>
"use strict";

const ADMIN_PASSWORD="JASSER 09";

const STORAGE={
products:"vyro_premium_products",
orders:"vyro_premium_orders",
settings:"vyro_premium_settings",
cart:"vyro_premium_cart"
};

const $=id=>document.getElementById(id);

const read=(key,fallback)=>{
try{
const value=localStorage.getItem(key);
return value===null?fallback:JSON.parse(value);
}catch{return fallback}
};

const write=(key,value)=>localStorage.setItem(key,JSON.stringify(value));

const esc=value=>String(value??"").replace(/[&<>"']/g,c=>({
"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
}[c]));

const uid=()=>Date.now()+Math.floor(Math.random()*10000);

/* THE STORE STARTS EMPTY. YOU ADD EVERY PRODUCT YOURSELF. */
let products=read(STORAGE.products,[]);
let orders=read(STORAGE.orders,[]);
let settings=read(STORAGE.settings,{
currency:"TND",
shipping:0,
storeName:"VYRO",
announcement:"THE NEW DIMENSION OF STREETWEAR"
});
let cart=read(STORAGE.cart,[]);

let state={
page:"home",
product:null,
color:0,
size:"",
quantity:1,
category:"ALL",
search:"",
adminTab:"dashboard",
editing:null,
checkoutOrigin:"cart"
};

function persist(){
write(STORAGE.products,products);
write(STORAGE.orders,orders);
write(STORAGE.settings,settings);
write(STORAGE.cart,cart);
}

function money(n){
return Number(n||0).toLocaleString("en-US",{
minimumFractionDigits:2,
maximumFractionDigits:2
})+" "+settings.currency;
}

function stockLevel(p){
let ratio=p.initialStock>0?p.stock/p.initialStock:0;
if(p.stock<=0||ratio<=.2)return"low";
if(ratio<=.5)return"medium";
return"high";
}

function stockLabel(p){
let level=stockLevel(p);
return level==="low"?"LOW STOCK":level==="medium"?"LIMITED STOCK":"AVAILABLE";
}

function toast(message){
let t=$("toast");
t.textContent=message;
t.classList.add("show");
clearTimeout(window.toastTimer);
window.toastTimer=setTimeout(()=>t.classList.remove("show"),2600);
}

function imageError(img){
img.onerror=null;
img.src="https://placehold.co/900x1100/030405/168cff?text=VYRO";
}

function icon(name){
const icons={
bag:'<svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M5 8h14l1 13H4L5 8Z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>',
home:'<svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.6"><path d="m3 10 9-7 9 7"/><path d="M5 9v12h14V9"/><path d="M9 21v-7h6v7"/></svg>',
search:'<svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg>'
};
return icons[name]||"";
}

function header(){
return `
<div class="topline">${esc(settings.announcement)}</div>
<header>
<div class="container nav">
<div class="nav-left">
<a href="#" class="logo" onclick="go('home');return false">VYRO<span>®</span></a>
<nav class="nav-links">
<a href="#" onclick="go('home');return false">HOME</a>
<a href="#" onclick="go('shop');return false">COLLECTION</a>
<a href="#" onclick="go('shop');return false">DISCOVER</a>
</nav>
</div>
<div class="nav-right">
<button class="icon-btn" aria-label="Search" onclick="go('shop');setTimeout(()=>$('shopSearch')?.focus(),100)">${icon("search")}</button>
<button class="icon-btn" aria-label="Shopping bag" style="position:relative" onclick="go('cart')">${icon("bag")}<span class="cart-count" id="cartCount">${cart.reduce((s,x)=>s+x.quantity,0)}</span></button>
<button class="icon-btn" aria-label="Home" onclick="go('home')">${icon("home")}</button>
</div>
</div>
</header>`;
}

function footer(){
return `
<footer>
<div class="container">
<div class="footer-grid">
<div class="footer-brand">
<div class="logo">VYRO<span>®</span></div>
<p>Beyond the ordinary. A new perspective on streetwear. Designed for those who define their own direction.</p>
</div>
<div class="footer-col">
<h4>EXPLORE</h4>
<p onclick="go('shop')" style="cursor:pointer">Collection</p>
<p onclick="go('shop')" style="cursor:pointer">Discover</p>
<p onclick="go('home')" style="cursor:pointer">Our world</p>
</div>
<div class="footer-col">
<h4>INFORMATION</h4>
<p>Premium streetwear</p>
<p>Made for the different</p>
<p>Tunisia · Worldwide vision</p>
</div>
</div>
<div class="footer-bottom">
<span>© ${new Date().getFullYear()} VYRO® ALL RIGHTS RESERVED</span>
<span>BEYOND THE ORDINARY.</span>
</div>
</div>
</footer>`;
}

function lightningSVG(){
return `
<svg class="hero-lightning" viewBox="0 0 1400 900" preserveAspectRatio="xMidYMid slice">
<defs>
<linearGradient id="boltGradient" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#003e9e" stop-opacity="0"/>
<stop offset=".45" stop-color="#087bff"/>
<stop offset="1" stop-color="#70baff" stop-opacity="0"/>
</linearGradient>
</defs>
<path d="M950 -80 L790 180 L875 165 L650 470 L730 285 L620 310 L770 -80" stroke="url(#boltGradient)" stroke-width="2.5" fill="none"/>
<path d="M790 180 L570 300 L620 310" stroke="#087bff" stroke-width="1.5" fill="none"/>
<path d="M650 470 L500 650 L660 560" stroke="#087bff" stroke-width="1.2" fill="none"/>
<path d="M210 40 L290 210 L245 205 L380 390" stroke="#0754b6" stroke-width="1.4" fill="none" opacity=".5"/>
</svg>`;
}

function homePage(){
return `${header()}
<main>
<section class="hero">
${lightningSVG()}
<div class="hero-content">
<div class="eyebrow">THE FUTURE OF STREETWEAR</div>
<div class="hero-mark">VYRO</div>
<div class="hero-rule"></div>
<h1>BEYOND THE ORDINARY</h1>
<p>Not made to follow. Designed to define. Discover the next dimension of contemporary streetwear.</p>
<div class="hero-actions">
<button class="btn btn-primary" onclick="go('shop')">✦ START SHOPPING <span>↗</span></button>
<button class="btn btn-ghost" onclick="go('adminLogin')">◈ PARAMETER</button>
</div>
</div>
<div class="hero-bottom">
<span>VYRO® — EST. 2026</span>
<span class="scroll-mark">SCROLL TO DISCOVER</span>
<span>01 / 03</span>
</div>
</section>

<section class="container section">
<div class="feature-banner">
<div class="banner-content">
<div class="eyebrow">VYRO / THE NEW DIMENSION</div>
<h2>BUILT FOR<br>THE UNEXPECTED.</h2>
<p>Discover pieces that speak without saying a word. A new chapter in the VYRO universe.</p>
<button class="btn btn-primary" onclick="go('shop')">EXPLORE THE COLLECTION ↗</button>
</div>
${lightningSVG()}
</div>

<div class="section-top">
<div>
<div class="eyebrow">YOUR NEXT STATEMENT</div>
<h2 class="section-heading" style="margin-top:12px">THE COLLECTION<span class="blue">.</span></h2>
<p class="section-sub">YOUR STYLE. YOUR IDENTITY.</p>
</div>
<button class="btn btn-ghost" onclick="go('shop')">VIEW COLLECTION ↗</button>
</div>

<div class="products-grid">${productCards(products.filter(p=>p.featured).slice(0,3))}</div>
</section>
</main>
${footer()}`;
}

function productCards(list){
if(!list.length){
return `<div class="empty" style="grid-column:1/-1">
<div class="empty-symbol">✧</div>
<h2>THE COLLECTION IS WAITING.</h2>
<p>New VYRO pieces will appear here once you publish your products.</p>
</div>`;
}
return list.map(p=>{
let c=p.colors?.[0];
return `
<article class="product-card" onclick="openProduct(${p.id})">
<div class="product-image">
<img src="${esc(c?.image||"")}" alt="${esc(p.name)}" loading="lazy" onerror="imageError(this)">
<span class="product-label">${esc(p.category||"VYRO EXCLUSIVE")}</span>
<button class="product-quick" aria-label="View product" onclick="event.stopPropagation();openProduct(${p.id})">↗</button>
</div>
<div class="product-info">
<h3>${esc(p.name)}</h3>
<div class="product-info-bottom">
<span class="product-price">${money(p.price)}</span>
<span class="stock-tag">${p.stock>0?stockLabel(p):"SOLD OUT"}</span>
</div>
</div>
</article>`;
}).join("");
}

function shopPage(){
let filtered=products.filter(p=>{
let category=state.category==="ALL"||p.category===state.category;
let search=p.name.toLowerCase().includes(state.search.toLowerCase());
return category&&search;
});
let categories=["ALL",...new Set(products.map(p=>p.category).filter(Boolean))];

return `${header()}
<main class="container section">
<div class="section-top">
<div>
<div class="eyebrow">VYRO / THE ARCHIVE</div>
<h1 class="section-heading" style="margin-top:13px">THE COLLECTION<span class="blue">.</span></h1>
<p class="section-sub">EXPLORE THE LATEST VYRO PIECES.</p>
</div>
<div class="kicker">${products.length} PIECES</div>
</div>

<div style="display:flex;gap:9px;flex-wrap:wrap;margin-bottom:25px">
${categories.map(c=>`<button class="choice ${state.category===c?"active":""}" onclick="state.category='${esc(c)}';render()">${esc(c)}</button>`).join("")}
</div>

<div class="field" style="max-width:420px;margin-bottom:30px">
<input id="shopSearch" placeholder="Search the collection..." value="${esc(state.search)}" oninput="state.search=this.value;updateProductGrid()">
</div>

<div id="shopProductGrid" class="products-grid">${productCards(filtered)}</div>
</main>
${footer()}`;
}

function updateProductGrid(){
let el=$("shopProductGrid");
if(!el)return;
let filtered=products.filter(p=>
(state.category==="ALL"||p.category===state.category)&&
p.name.toLowerCase().includes(state.search.toLowerCase())
);
el.innerHTML=productCards(filtered);
}

function openProduct(id){
let p=products.find(x=>x.id===id);
if(!p)return;
state.product=id;
state.color=0;
state.size=p.sizes?.[0]||"";
state.quantity=1;
go("product");
}

function productPage(){
let p=products.find(x=>x.id===state.product);
if(!p)return shopPage();
let color=p.colors[state.color]||p.colors[0];

return `${header()}
<main class="container section">
<button class="btn btn-ghost" onclick="go('shop')" style="margin-bottom:30px">← BACK TO COLLECTION</button>
<div class="detail-layout">
<div class="detail-gallery">
<img id="detailMainImage" class="detail-main-image" src="${esc(color?.image||"")}" alt="${esc(p.name)}" onerror="imageError(this)">
<div class="detail-thumbs">
${p.colors.map((c,i)=>`<img class="detail-thumb ${i===state.color?"active":""}" src="${esc(c.image)}" onerror="imageError(this)" onclick="selectColor(${i})" alt="${esc(c.name)}">`).join("")}
</div>
</div>

<div class="detail-info">
<div class="eyebrow">${esc(p.category||"VYRO EXCLUSIVE")} · LIMITED RELEASE</div>
<h1>${esc(p.name)}</h1>
<div class="detail-price">${money(p.price)}</div>
<p class="detail-description">${esc(p.description)}</p>

<div class="field">
<label>01 — SELECT COLOR</label>
<div class="choices">
${p.colors.map((c,i)=>`<button class="choice color-choice ${i===state.color?"active":""}" onclick="selectColor(${i})"><span class="swatch" style="background:${esc(c.hex||"#777")}"></span>${esc(c.name)}</button>`).join("")}
</div>
</div>

<div class="field">
<label>02 — SELECT SIZE</label>
<div class="choices">
${p.sizes.map(s=>`<button class="choice ${s===state.size?"active":""}" onclick="selectSize('${esc(s)}')">${esc(s)}</button>`).join("")}
</div>
</div>

<div class="field">
<label>03 — QUANTITY</label>
<div class="qty-control">
<button onclick="setQuantity(-1)">−</button>
<span id="detailQty">${state.quantity}</span>
<button onclick="setQuantity(1)">＋</button>
</div>
</div>

<div class="stock-line stock-${stockLevel(p)}">${p.stock} PIECES REMAINING · ${stockLabel(p)}</div>

<div class="detail-buttons">
<button class="btn btn-ghost" onclick="addCart()">ADD TO BAG +</button>
<button class="btn btn-primary" onclick="buyNow()">BUY NOW ↗</button>
</div>

<div style="border-top:1px solid var(--line);margin-top:28px;padding-top:22px;display:grid;gap:15px">
<div class="kicker">✧ PREMIUM STREETWEAR</div>
<div class="kicker">◈ LIMITED COLLECTION</div>
<div class="kicker">↗ VYRO EXCLUSIVE DESIGN</div>
</div>
</div>
</div>
</main>
${footer()}`;
}

function selectColor(i){state.color=i;render()}
function selectSize(s){state.size=s;render()}

function setQuantity(n){
let p=products.find(x=>x.id===state.product);
state.quantity=Math.max(1,Math.min(p.stock,state.quantity+n));
$("detailQty").textContent=state.quantity;
}

function addCart(){
let p=products.find(x=>x.id===state.product);
if(!state.size)return toast("Please select a size.");
if(!p.stock||p.stock<state.quantity)return toast("Not enough stock available.");
let existing=cart.find(x=>x.id===p.id&&x.color===state.color&&x.size===state.size);
if(existing)existing.quantity=Math.min(p.stock,existing.quantity+state.quantity);
else cart.push({id:p.id,color:state.color,size:state.size,quantity:state.quantity});
persist();updateCartCount();toast("Added to your VYRO bag.");
}

function buyNow(){
let p=products.find(x=>x.id===state.product);
if(!state.size)return toast("Please select a size.");
if(!p.stock||p.stock<state.quantity)return toast("Not enough stock available.");
cart=[{id:p.id,color:state.color,size:state.size,quantity:state.quantity}];
persist();state.checkoutOrigin="direct";go("checkout");
}

function updateCartCount(){
let el=$("cartCount");
if(el)el.textContent=cart.reduce((s,x)=>s+x.quantity,0);
}

function cartPage(){
let total=cart.reduce((s,x)=>s+(products.find(p=>p.id===x.id)?.price||0)*x.quantity,0);

return `${header()}
<main class="container section">
<div class="eyebrow">YOUR VYRO EXPERIENCE</div>
<h1 class="section-heading" style="margin-top:12px">YOUR BAG<span class="blue">.</span></h1>
<p class="section-sub">YOUR SELECTED PIECES.</p>

${cart.length?`
<div class="checkout-layout" style="margin-top:35px">
<div class="glass checkout-panel">
<h2>SELECTED ITEMS <span class="blue">(${cart.length})</span></h2>
${cart.map((x,i)=>{
let p=products.find(p=>p.id===x.id);
if(!p)return"";
let c=p.colors[x.color];
return `
<div class="bag-row">
<img src="${esc(c?.image||"")}" onerror="imageError(this)" alt="">
<div class="bag-info">
<h3>${esc(p.name)}</h3>
<p>${esc(c?.name)} · SIZE ${esc(x.size)}</p>
<p>QUANTITY: ${x.quantity}</p>
<div class="price">${money(p.price*x.quantity)}</div>
<button class="btn btn-small btn-ghost" style="margin-top:12px" onclick="removeCart(${i})">REMOVE ITEM ×</button>
</div>
</div>`;
}).join("")}
</div>

<div class="glass summary-panel">
<h2>ORDER SUMMARY</h2>
<div class="total-row"><span>Subtotal</span><b>${money(total)}</b></div>
<div class="total-row"><span>Shipping</span><b>${settings.shipping?money(settings.shipping):"Calculated separately"}</b></div>
<div class="total-row final"><span>Total</span><b>${money(total+Number(settings.shipping||0))}</b></div>
<button class="btn btn-primary" style="width:100%;margin-top:22px;padding:17px" onclick="state.checkoutOrigin='cart';go('checkout')">PROCEED TO CHECKOUT ↗</button>
<button class="btn btn-ghost" style="width:100%;margin-top:10px" onclick="go('shop')">CONTINUE SHOPPING</button>
</div>
</div>`:`
<div class="empty" style="margin-top:35px">
<div class="empty-symbol">◈</div>
<h2>YOUR BAG IS EMPTY</h2>
<p>Discover your next VYRO piece.</p>
<button class="btn btn-primary" style="margin-top:25px" onclick="go('shop')">EXPLORE COLLECTION ↗</button>
</div>`}
</main>
${footer()}`;
}

function removeCart(i){
cart.splice(i,1);
persist();
render();
}

function checkoutPage(){
if(!cart.length)return cartPage();

let total=cart.reduce((s,x)=>s+(products.find(p=>p.id===x.id)?.price||0)*x.quantity,0);
let grand=total+Number(settings.shipping||0);

return `${header()}
<main class="container section">
<button class="btn btn-ghost" onclick="go('cart')">← BACK TO BAG</button>
<div style="margin:28px 0">
<div class="eyebrow">FINAL STEP / DELIVERY</div>
<h1 class="section-heading" style="margin-top:12px">CHECKOUT<span class="blue">.</span></h1>
<p class="section-sub">COMPLETE YOUR ORDER INFORMATION.</p>
</div>

<div class="checkout-layout">
<div class="glass checkout-panel">
<h2>DELIVERY INFORMATION</h2>
<form id="checkoutForm" onsubmit="submitOrder(event)">
<div class="form-grid">
<div class="field"><label>FIRST NAME *</label><input name="first" required maxlength="50" placeholder="First name"></div>
<div class="field"><label>LAST NAME *</label><input name="last" required maxlength="50" placeholder="Last name"></div>
</div>

<div class="field">
<label>WILAYA *</label>
<select name="wilaya" required>
<option value="">Choose your wilaya</option>
${["Tunis","Ariana","Ben Arous","Manouba","Nabeul","Zaghouan","Bizerte","Béja","Jendouba","Le Kef","Siliana","Sousse","Monastir","Mahdia","Sfax","Kairouan","Kasserine","Sidi Bouzid","Gabès","Medenine","Tataouine","Gafsa","Tozeur","Kebili"].map(w=>`<option>${w}</option>`).join("")}
</select>
</div>

<div class="field"><label>FULL DELIVERY ADDRESS *</label><textarea name="address" rows="4" required maxlength="300" placeholder="Street, building, area, city..."></textarea></div>
<div class="field"><label>PHONE NUMBER *</label><input name="phone" type="tel" required maxlength="20" placeholder="+216 XX XXX XXX"></div>
<div class="field"><label>ADDITIONAL NOTES</label><textarea name="notes" rows="2" maxlength="300" placeholder="Optional delivery notes"></textarea></div>
<button class="btn btn-primary" type="submit" style="width:100%;padding:17px">CONFIRM MY ORDER ↗</button>
<p class="kicker" style="margin-top:16px;line-height:1.8">BY CONFIRMING, YOU AGREE TO PROVIDE ACCURATE DELIVERY INFORMATION.</p>
</form>
</div>

<div class="glass summary-panel">

function submitOrder(event){
event.preventDefault();
let form=new FormData(event.target);
let items=[];

for(let x of cart){
let p=products.find(p=>p.id===x.id);
if(!p||p.stock<x.quantity)return toast("An item is no longer available.");
items.push({
id:p.id,
name:p.name,
color:p.colors[x.color]?.name||"",
size:x.size,
quantity:x.quantity,
price:p.price,
image:p.colors[x.color]?.image||""
});
}

let subtotal=items.reduce((s,x)=>s+x.price*x.quantity,0);
let order={
id:"VY-"+String(uid()).slice(-9),
date:new Date().toISOString(),
first:String(form.get("first")).trim(),
last:String(form.get("last")).trim(),
wilaya:String(form.get("wilaya")),
address:String(form.get("address")).trim(),
phone:String(form.get("phone")).trim(),
notes:String(form.get("notes")||"").trim(),
items,subtotal,
shipping:Number(settings.shipping||0),
total:subtotal+Number(settings.shipping||0),
status:"New"
};

if(!/^[+0-9\s()-]{8,20}$/.test(order.phone))return toast("Please enter a valid phone number.");

for(let x of items){
let p=products.find(p=>p.id===x.id);
p.stock-=x.quantity;
}

orders.unshift(order);
cart=[];
persist();
updateCartCount();
state.page="success";
render();
}

function previewVariant(input){
let card=input.closest(".color-editor");
let img=card.querySelector(".preview-image");
img.src=input.value;
img.classList.remove("hidden");
}

function uploadVariant(input){
let file=input.files?.[0];
if(!file)return;
if(!file.type.startsWith("image/"))return toast("Please select an image file.");
if(file.size>1.5*1024*1024)return toast("Image too large. Use an image under 1.5 MB.");
let reader=new FileReader();
reader.onload=()=>{
let card=input.closest(".color-editor");
card.querySelector(".variant-url").value=reader.result;
let img=card.querySelector(".preview-image");
img.src=reader.result;
img.classList.remove("hidden");
};
reader.readAsDataURL(file);
}

function saveProduct(e){
e.preventDefault();

let name=$("pName").value.trim();
let price=Number($("pPrice").value);
let initialStock=Number($("pInitial").value);
let stock=Number($("pStock").value);

if(!name||price<0||initialStock<0||stock<0)return toast("Check your product details.");

let colors=[...document.querySelectorAll(".color-editor")].map(el=>({
name:el.querySelector(".variant-name").value.trim(),
hex:el.querySelector(".variant-hex").value.trim()||"#111111",
image:el.querySelector(".variant-url").value.trim()
}));

if(!colors.length||colors.some(c=>!c.name||!c.image))return toast("Each color needs a name and image.");

let sizes=$("pSizes").value.split(",").map(x=>x.trim()).filter(Boolean);
if(!sizes.length)return toast("Add at least one size.");

let data={
id:state.editing||uid(),
name,price,
description:$("pDescription").value.trim(),
category:$("pCategory").value,
featured:$("pFeatured").value==="true",
initialStock,stock,sizes,colors
};

if(state.editing){
let i=products.findIndex(x=>x.id===state.editing);
if(i>=0)products[i]=data;
}else{
products.unshift(data);
}

state.editing=null;
persist();
adminTab("products");
toast("Product saved successfully.");
}

function settingsPage(){
return `
<div class="eyebrow">STORE CONFIGURATION</div>
<h1 class="admin-title">Settings.</h1>
<p class="admin-subtitle">CUSTOMIZE YOUR VYRO EXPERIENCE.</p>

<div class="admin-panel" style="margin-top:28px">
<h3 style="font-size:14px;margin-bottom:20px">GENERAL SETTINGS</h3>
<div class="field"><label>STORE NAME</label><input id="settingName" value="${esc(settings.storeName)}"></div>
<div class="field">
<label>CURRENCY</label>
<select id="settingCurrency">
${["TND","EUR","USD"].map(x=>`<option ${settings.currency===x?"selected":""}>${x}</option>`).join("")}
</select>
</div>
<div class="field"><label>SHIPPING FEE</label><input id="settingShipping" type="number" min="0" step=".01" value="${settings.shipping}"></div>
<div class="field"><label>ANNOUNCEMENT BAR</label><input id="settingAnnouncement" value="${esc(settings.announcement)}"></div>
<button class="btn btn-primary" onclick="saveSettings()">SAVE CONFIGURATION ↗</button>
</div>

<div class="admin-panel">
<h3 style="font-size:14px;margin-bottom:20px">DATA MANAGEMENT</h3>
<p class="kicker" style="line-height:2">EXPORT A BACKUP OF YOUR PRODUCTS, ORDERS AND SETTINGS OR RESTORE A PREVIOUS BACKUP.</p>
<div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:20px">
<button class="btn btn-ghost" onclick="exportBackup()">↓ EXPORT BACKUP</button>
<button class="btn btn-ghost" onclick="$('backupFile').click()">↑ IMPORT BACKUP</button>
<input id="backupFile" class="hidden" type="file" accept=".json" onchange="importBackup(event)">
</div>
</div>

<div class="admin-panel">
<h3 style="font-size:14px;margin-bottom:12px">STORE INFRASTRUCTURE</h3>
<p class="kicker" style="line-height:2.1">
THIS VERSION USES LOCAL BROWSER STORAGE. PRODUCTS, ORDERS AND STOCK ARE STORED IN THE CURRENT BROWSER ONLY. ORDERS PLACED BY CUSTOMERS ON OTHER DEVICES WILL NOT AUTOMATICALLY APPEAR HERE. FOR A REAL PUBLIC STORE, CONNECT A SECURE DATABASE AND SERVER-SIDE ADMIN AUTHENTICATION. THE FRONT-END ADMIN PASSWORD IS NOT A SECURITY BOUNDARY.
</p>
</div>`;
}

function saveSettings(){
settings={
storeName:$("settingName").value.trim()||"VYRO",
currency:$("settingCurrency").value,
shipping:Math.max(0,Number($("settingShipping").value)||0),
announcement:$("settingAnnouncement").value.trim()
};
persist();
toast("Settings saved.");
render();
}

function exportBackup(){
let data={version:1,products,orders,settings};
let blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
let url=URL.createObjectURL(blob);
let a=document.createElement("a");
a.href=url;
a.download="VYRO-STORE-BACKUP.json";
a.click();
URL.revokeObjectURL(url);
}

function importBackup(e){
let file=e.target.files?.[0];
if(!file)return;
let reader=new FileReader();
reader.onload=()=>{
try{
let data=JSON.parse(reader.result);
if(!Array.isArray(data.products)||!Array.isArray(data.orders))throw Error("Invalid");
products=data.products;
orders=data.orders;
settings=data.settings||settings;
persist();
render();
toast("Backup imported successfully.");
}catch{
toast("Invalid backup file.");
}
};
reader.readAsText(file);
}

function modal(content){
let existing=$("modalBackdrop");
if(existing)existing.remove();
let el=document.createElement("div");
el.id="modalBackdrop";
el.className="modal-backdrop";
el.innerHTML=`<div class="modal-card">${content}</div>`;
el.addEventListener("click",e=>{if(e.target===el)closeModal()});
document.body.appendChild(el);
}

function closeModal(){$("modalBackdrop")?.remove()}

function go(page){
state.page=page;
render();
window.scrollTo({top:0,behavior:"instant"});
}

function render(){
let app=$("app");
switch(state.page){
case"shop":app.innerHTML=shopPage();break;
case"product":app.innerHTML=productPage();break;
case"cart":app.innerHTML=cartPage();break;
case"checkout":app.innerHTML=checkoutPage();break;
case"success":app.innerHTML=successPage();break;
case"adminLogin":app.innerHTML=adminLoginPage();break;
case"admin":app.innerHTML=adminPage();break;
default:app.innerHTML=homePage();
}
updateCartCount();
}

window.addEventListener("storage",e=>{
if(Object.values(STORAGE).includes(e.key)){
products=read(STORAGE.products,products);
orders=read(STORAGE.orders,orders);
settings=read(STORAGE.settings,settings);
cart=read(STORAGE.cart,cart);
render();
}
});

render();
</script>
</body>
</html>
